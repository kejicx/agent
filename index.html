<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MuYanCoding｜编程Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --muyan-green: #a5d296;
            --muyan-green-dark: #8bb87a;
            --muyan-green-glow: rgba(165, 210, 150, 0.25);
            --muyan-green-soft: #f0f7ec;
            --bg-gradient: radial-gradient(circle at 10% 20%, rgba(165,210,150,0.05) 0%, #FFFFFF 90%);
            --border-light: #E5E7EB;
            --text-primary: #1F2937;
            --text-secondary: #4B5563;
            --success: #10B981;
            --warning: #F59E0B;
            --error: #EF4444;
            --console-bg: #1e1e2f;
            --console-text: #cbd5e6;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            overflow: hidden;
        }
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .toolbar {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-light);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.3rem;
            background: linear-gradient(135deg, var(--muyan-green), #6b9e56);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .api-panel {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .api-panel input, .api-panel select {
            background: white;
            border: 1px solid var(--border-light);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            outline: none;
        }
        button {
            background: #F3F4F6;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        button.primary {
            background: var(--muyan-green);
            color: #1F2937;
        }
        button.primary:hover {
            background: var(--muyan-green-dark);
        }
        button.danger {
            background: #FEF2F2;
            color: var(--error);
        }
        .status-badge {
            background: #F3F4F6;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-family: monospace;
        }
        .main-split {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 1px;
            background: var(--border-light);
        }
        .workspace {
            width: 42%;
            min-width: 300px;
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .file-header {
            padding: 14px 16px;
            background: #F9FAFB;
            border-bottom: 1px solid var(--border-light);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }
        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-family: monospace;
            font-size: 0.8rem;
        }
        .file-item:hover {
            background: var(--muyan-green-soft);
        }
        .file-item.active {
            background: var(--muyan-green-soft);
            border-left: 3px solid var(--muyan-green);
        }
        .editor-area {
            background: white;
            border-top: 1px solid var(--border-light);
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .editor-toolbar {
            padding: 10px 16px;
            background: #F9FAFB;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
        }
        #file-editor {
            flex: 1;
            border: none;
            padding: 16px;
            font-family: 'SF Mono', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            background: #FEFEFE;
        }
        .agent-panel {
            flex: 1;
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg {
            border-radius: 20px;
            padding: 12px 18px;
            max-width: 90%;
            animation: fadeIn 0.2s ease;
        }
        .user-msg {
            background: var(--muyan-green);
            color: #1F2937;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }
        .agent-msg {
            background: #F9FAFB;
            border: 1px solid var(--border-light);
            align-self: flex-start;
            border-left: 3px solid var(--muyan-green);
            white-space: normal;
            word-wrap: break-word;
        }
        .feedback-msg {
            background: #F3F4F6;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-family: monospace;
            align-self: flex-start;
            border-left: 2px solid var(--success);
        }
        .thinking {
            background: #F3F4F6;
            padding: 6px 12px;
            border-radius: 12px;
            font-style: italic;
            font-size: 0.8rem;
            border-left: 2px solid var(--warning);
            margin: 6px 0;
        }
        .highlight {
            background: rgba(165,210,150,0.3);
            border-radius: 6px;
            padding: 0 3px;
        }
        pre {
            background: #1E293B;
            color: #E2E8F0;
            border-radius: 12px;
            padding: 10px;
            overflow-x: auto;
            font-size: 12px;
            margin: 8px 0;
        }
        .task-done {
            color: var(--success);
            background: #D1FAE5;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        .waiting-pill {
            background: #FEF3C7;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        .input-area {
            padding: 16px;
            background: white;
            border-top: 1px solid var(--border-light);
            display: flex;
            gap: 12px;
        }
        textarea {
            flex: 1;
            background: #F9FAFB;
            border: 1px solid var(--border-light);
            border-radius: 28px;
            padding: 10px 18px;
            font-family: inherit;
            resize: none;
            outline: none;
        }
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background: white;
            border-radius: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            border: 1px solid var(--muyan-green);
        }
        .modal-header {
            padding: 12px 20px;
            background: #F9FAFB;
            border-radius: 24px 24px 0 0;
            display: flex;
            justify-content: space-between;
        }
        .modal iframe {
            flex: 1;
            border: none;
        }
        .hidden {
            display: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .agent-msg h1 { font-size: 1.8rem; font-weight: 700; margin: 0.5rem 0; }
        .agent-msg h2 { font-size: 1.5rem; font-weight: 600; margin: 0.5rem 0; }
        .agent-msg h3 { font-size: 1.3rem; font-weight: 600; margin: 0.4rem 0; }
        .agent-msg h4 { font-size: 1.1rem; font-weight: 600; margin: 0.4rem 0; }
        .agent-msg h5 { font-size: 1rem; font-weight: 600; margin: 0.3rem 0; }
        .agent-msg h6 { font-size: 0.9rem; font-weight: 600; margin: 0.3rem 0; }
        .agent-msg ul, .agent-msg ol { margin: 0.5rem 0 0.5rem 1.5rem; }
        .agent-msg li { margin: 0.2rem 0; }
        .agent-msg blockquote { border-left: 3px solid var(--muyan-green); padding-left: 1rem; margin: 0.5rem 0; color: var(--text-secondary); }
        .agent-msg hr { margin: 1rem 0; border: none; border-top: 1px solid var(--border-light); }
        .agent-msg table { border-collapse: collapse; width: 100%; margin: 0.5rem 0; }
        .agent-msg th, .agent-msg td { border: 1px solid var(--border-light); padding: 6px 10px; text-align: left; }
        .agent-msg th { background: var(--muyan-green-soft); }
        .bold { font-weight: 700; }
        .italic { font-style: italic; }
        .preview-btn {
            background: var(--muyan-green);
            border: none;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            margin-left: 8px;
        }
        .preview-btn:hover {
            background: var(--muyan-green-dark);
        }
        .console-area {
            background: var(--console-bg);
            color: var(--console-text);
            border-top: 1px solid var(--border-light);
            height: 200px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: 'SF Mono', monospace;
            font-size: 12px;
        }
        .console-header {
            padding: 6px 12px;
            background: #2a2a3b;
            font-weight: 500;
            border-bottom: 1px solid #3a3a4b;
            display: flex;
            gap: 16px;
        }
        .console-header span {
            cursor: pointer;
            opacity: 0.7;
        }
        .console-header span.active {
            opacity: 1;
            color: var(--muyan-green);
        }
        .console-log {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            line-height: 1.5;
        }
        .log-entry {
            margin: 4px 0;
            border-left: 2px solid transparent;
            padding-left: 8px;
        }
        .log-info { border-left-color: var(--muyan-green); }
        .log-error { border-left-color: var(--error); color: #fca5a5; }
        .log-warn { border-left-color: var(--warning); }
        .log-success { border-left-color: var(--success); }
        .log-time {
            color: #8892b0;
            margin-right: 10px;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="toolbar">
        <div class="logo">💚 MuYanCoding</div>
        <div class="api-panel">
            <input type="text" id="apiKey" placeholder="DeepSeek API Key" style="width: 220px;">
            <select id="modelSelect">
                <option value="deepseek-chat">deepseek-chat</option>
                <option value="deepseek-coder">deepseek-coder</option>
                <option value="deepseek-v4-flash">deepseek-v4-flash</option>
                <option value="deepseek-v4-pro">deepseek-v4-pro</option>
            </select>
            <button id="saveKeyBtn" class="primary">保存</button>
            <button id="stopBtn" class="danger">停止</button>
            <div class="status-badge" id="status">⚪ 空闲</div>
        </div>
    </div>
    <div class="main-split">
        <div class="workspace">
            <div class="file-header">
                <span>📁 工作台</span>
                <button id="newFileBtn">+ 新建</button>
            </div>
            <div class="file-tree" id="fileTree"></div>
            <div class="editor-area">
                <div class="editor-toolbar">
                    <span id="curFile">未选择</span>
                    <div>
                        <button id="saveFileBtn">💾 保存</button>
                        <button id="downloadBtn">📥 下载</button>
                        <button id="manualPreviewBtn" class="preview-btn hidden">🌐 预览</button>
                    </div>
                </div>
                <textarea id="editor" placeholder="MuYanCoding 会直接编辑文件"></textarea>
            </div>
        </div>
        <div class="agent-panel">
            <div class="messages" id="messages"></div>
            <div class="console-area">
                <div class="console-header">
                    <span id="consoleTabLog" class="active">📋 执行日志</span>
                    <span id="consoleTabClear" style="margin-left:auto;">🗑️ 清空</span>
                </div>
                <div class="console-log" id="consoleLog"></div>
            </div>
            <div class="input-area">
                <textarea id="prompt" rows="1" placeholder="描述任务，我会用工作台和真实工具完成"></textarea>
                <button id="sendBtn" class="primary">发送</button>
            </div>
        </div>
    </div>
</div>
<div id="previewModal" class="modal hidden">
    <div class="modal-header"><span>🌐 实时预览</span><button id="closePreview">✖</button></div>
    <iframe id="previewFrame"></iframe>
</div>

<script>
    let virtualFs = {};
    let currentFile = null;
    let apiKey = localStorage.getItem("muyan_api") || "";
    let selectedModel = "deepseek-chat";
    let agentActive = false;
    let waitingResolver = null;
    let conversationHistory = [];
    let lastReplyHash = "";
    let consecutiveSameCount = 0;
    let noOperationCount = 0;

    const fileTreeDiv = document.getElementById("fileTree");
    const editor = document.getElementById("editor");
    const curFileSpan = document.getElementById("curFile");
    const messagesDiv = document.getElementById("messages");
    const promptInput = document.getElementById("prompt");
    const sendBtn = document.getElementById("sendBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusSpan = document.getElementById("status");
    const newFileBtn = document.getElementById("newFileBtn");
    const saveFileBtn = document.getElementById("saveFileBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const previewModal = document.getElementById("previewModal");
    const previewFrame = document.getElementById("previewFrame");
    const closePreview = document.getElementById("closePreview");
    const apiKeyInput = document.getElementById("apiKey");
    const modelSelect = document.getElementById("modelSelect");
    const saveKeyBtn = document.getElementById("saveKeyBtn");
    const manualPreviewBtn = document.getElementById("manualPreviewBtn");
    const consoleLogDiv = document.getElementById("consoleLog");
    const consoleTabClear = document.getElementById("consoleTabClear");

    function addConsoleLog(message, type = "info") {
        const entry = document.createElement("div");
        entry.className = `log-entry log-${type}`;
        const time = new Date().toLocaleTimeString();
        entry.innerHTML = `<span class="log-time">[${time}]</span> ${escapeHtml(message)}`;
        consoleLogDiv.appendChild(entry);
        entry.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
    consoleTabClear.onclick = () => { consoleLogDiv.innerHTML = ""; addConsoleLog("控制台已清空", "info"); };

    if (apiKey) apiKeyInput.value = apiKey;
    saveKeyBtn.onclick = () => {
        apiKey = apiKeyInput.value.trim();
        localStorage.setItem("muyan_api", apiKey);
        addFeedbackMsg("✅ API Key 已保存");
        addConsoleLog("API Key 已保存", "success");
    };
    modelSelect.onchange = () => { selectedModel = modelSelect.value; addConsoleLog(`切换模型: ${selectedModel}`, "info"); };

    function renderFileTree() {
        fileTreeDiv.innerHTML = "";
        if (Object.keys(virtualFs).length === 0) {
            let emptyDiv = document.createElement("div");
            emptyDiv.style.padding = "20px";
            emptyDiv.style.textAlign = "center";
            emptyDiv.style.color = "var(--text-secondary)";
            emptyDiv.innerText = "暂无文件，点击 + 新建";
            fileTreeDiv.appendChild(emptyDiv);
        } else {
            Object.keys(virtualFs).sort().forEach(p => {
                const div = document.createElement("div");
                div.className = "file-item" + (currentFile === p ? " active" : "");
                div.innerHTML = `<span>📄 ${p}</span><button class="delBtn" data-path="${p}" style="background:none; border:none; color:#EF4444;">🗑️</button>`;
                div.onclick = (e) => { if (e.target.classList.contains("delBtn")) return; selectFile(p); };
                const del = div.querySelector(".delBtn");
                del.onclick = (e) => { e.stopPropagation(); deleteFile(p); };
                fileTreeDiv.appendChild(div);
            });
        }
        if (currentFile && virtualFs[currentFile]) editor.value = virtualFs[currentFile].content;
        else editor.value = "";
        curFileSpan.innerText = currentFile || "未选择";
        if (currentFile && (currentFile.endsWith(".html") || currentFile.endsWith(".htm"))) {
            manualPreviewBtn.classList.remove("hidden");
        } else {
            manualPreviewBtn.classList.add("hidden");
        }
    }
    function selectFile(p) {
        currentFile = p;
        editor.value = virtualFs[p].content;
        curFileSpan.innerText = p;
        renderFileTree();
        addConsoleLog(`打开文件: ${p}`, "info");
    }
    function saveCurrent() {
        if (currentFile && virtualFs[currentFile]) {
            virtualFs[currentFile].content = editor.value;
            addFeedbackMsg(`💾 已保存 ${currentFile}`);
            addConsoleLog(`保存文件: ${currentFile}`, "success");
            renderFileTree();
        } else if (currentFile && !virtualFs[currentFile]) {
            virtualFs[currentFile] = { content: editor.value };
            addFeedbackMsg(`📄 创建并保存 ${currentFile}`);
            addConsoleLog(`创建并保存: ${currentFile}`, "success");
            renderFileTree();
        } else {
            addFeedbackMsg("请先选择或创建文件");
        }
    }
    function deleteFile(p) {
        if (confirm(`删除 ${p}?`)) {
            delete virtualFs[p];
            if (currentFile === p) {
                let keys = Object.keys(virtualFs);
                currentFile = keys[0] || null;
                if (currentFile) editor.value = virtualFs[currentFile].content;
                else editor.value = "";
            }
            renderFileTree();
            addFeedbackMsg(`🗑️ 已删除 ${p}`);
            addConsoleLog(`删除文件: ${p}`, "warn");
        }
    }
    function newFile() {
        let name = prompt("文件名:", "newfile.txt");
        if (name && !virtualFs[name]) {
            virtualFs[name] = { content: "" };
            currentFile = name;
            editor.value = "";
            renderFileTree();
            addFeedbackMsg(`📄 创建 ${name}`);
            addConsoleLog(`创建新文件: ${name}`, "success");
        } else if (name) alert("文件已存在");
    }
    newFileBtn.onclick = newFile;
    saveFileBtn.onclick = saveCurrent;
    downloadBtn.onclick = () => {
        if (currentFile && virtualFs[currentFile]) {
            let blob = new Blob([virtualFs[currentFile].content], {type: "text/plain"});
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = currentFile;
            a.click();
            URL.revokeObjectURL(a.href);
            addConsoleLog(`下载文件: ${currentFile}`, "info");
        } else {
            addFeedbackMsg("没有可下载的文件");
        }
    };
    closePreview.onclick = () => previewModal.classList.add("hidden");
    manualPreviewBtn.onclick = () => {
        if (currentFile && virtualFs[currentFile]) {
            let content = virtualFs[currentFile].content;
            previewFrame.srcdoc = content;
            previewModal.classList.remove("hidden");
            addConsoleLog(`手动预览: ${currentFile}`, "info");
        } else {
            addFeedbackMsg("没有可预览的文件");
        }
    };
    renderFileTree();

    function addFeedbackMsg(text) {
        let div = document.createElement("div");
        div.className = "msg feedback-msg";
        div.innerHTML = `🔧 ${escapeHtml(text)}`;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    function addUserMsg(text) {
        let div = document.createElement("div");
        div.className = "msg user-msg";
        div.innerHTML = `<div>${escapeHtml(text)}</div>`;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    function addAgentMsgWithStream() {
        let div = document.createElement("div");
        div.className = "msg agent-msg";
        div.innerHTML = "";
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return div;
    }
    function escapeHtml(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]); }

    async function executeFileOperation(operation, path, content = null) {
        const start = Date.now();
        addConsoleLog(`执行文件操作: ${operation} ${path}`, "info");
        try {
            if (operation === "create") {
                if (virtualFs[path]) return `❌ 创建失败: 文件 ${path} 已存在`;
                virtualFs[path] = { content: content || "" };
                renderFileTree();
                addConsoleLog(`文件创建成功: ${path} (耗时 ${Date.now()-start}ms)`, "success");
                return `✅ 文件已创建: ${path}`;
            } else if (operation === "update") {
                if (!virtualFs[path]) return `❌ 更新失败: 文件 ${path} 不存在`;
                virtualFs[path].content = content;
                if (currentFile === path) editor.value = content;
                renderFileTree();
                addConsoleLog(`文件更新成功: ${path} (耗时 ${Date.now()-start}ms)`, "success");
                return `✅ 文件已更新: ${path}`;
            } else if (operation === "delete") {
                if (!virtualFs[path]) return `❌ 删除失败: 文件 ${path} 不存在`;
                delete virtualFs[path];
                if (currentFile === path) {
                    let keys = Object.keys(virtualFs);
                    currentFile = keys[0] || null;
                    if (currentFile) editor.value = virtualFs[currentFile].content;
                    else editor.value = "";
                }
                renderFileTree();
                addConsoleLog(`文件删除成功: ${path} (耗时 ${Date.now()-start}ms)`, "warn");
                return `✅ 文件已删除: ${path}`;
            }
        } catch (e) {
            addConsoleLog(`文件操作异常: ${e.message}`, "error");
            return `❌ 操作异常: ${e.message}`;
        }
        return "未知操作";
    }

    async function checkCode(code, language = "javascript") {
        const start = Date.now();
        addConsoleLog(`代码检查: ${language} (长度 ${code.length})`, "info");
        let issues = [];
        if (language === "javascript" || language === "js") {
            if (code.includes("console.log")) issues.push("包含 console.log");
            if (code.includes("alert")) issues.push("使用了 alert");
            if (code.includes("eval(")) issues.push("使用了 eval");
        }
        if (code.length > 10000) issues.push("代码超过 10000 字符");
        const result = issues.length === 0 ? "✅ 代码检查通过" : `⚠️ ${issues.join("; ")}`;
        addConsoleLog(`代码检查完成: ${result} (耗时 ${Date.now()-start}ms)`, issues.length ? "warn" : "success");
        return result;
    }

    async function httpRequest(url, method = "GET", body = null) {
        const start = Date.now();
        addConsoleLog(`HTTP请求: ${method} ${url}`, "info");
        try {
            let options = { method, headers: { "Content-Type": "application/json" } };
            if (body) options.body = JSON.stringify(body);
            let response = await fetch(url, options);
            let data = await response.text();
            addConsoleLog(`HTTP响应: ${response.status} (耗时 ${Date.now()-start}ms)`, response.ok ? "success" : "error");
            return `HTTP ${response.status}: ${data.slice(0, 500)}${data.length > 500 ? "..." : ""}`;
        } catch (e) {
            addConsoleLog(`HTTP请求失败: ${e.message}`, "error");
            return `❌ 请求失败: ${e.message}`;
        }
    }

    function getCurrentTime() { 
        const t = new Date().toLocaleString("zh-CN", { timeZone: "Asia/Shanghai" });
        addConsoleLog(`获取时间: ${t}`, "info");
        return t; 
    }
    function calculate(expression) { 
        addConsoleLog(`计算表达式: ${expression}`, "info");
        try { let result = eval(expression); addConsoleLog(`计算结果: ${result}`, "success"); return `计算结果: ${expression} = ${result}`; } 
        catch(e) { addConsoleLog(`计算错误: ${e.message}`, "error"); return `❌ 计算错误: ${e.message}`; } 
    }
    function encodeBase64(str) { 
        let r = btoa(unescape(encodeURIComponent(str)));
        addConsoleLog(`Base64编码: ${str.substring(0,30)}... -> ${r.substring(0,30)}...`, "info");
        return r;
    }
    function decodeBase64(str) { 
        try { let r = decodeURIComponent(escape(atob(str))); addConsoleLog(`Base64解码成功`, "success"); return r; } 
        catch(e) { addConsoleLog(`Base64解码失败: ${e.message}`, "error"); return "解码失败"; } 
    }
    async function searchWeb(query) {
        addConsoleLog(`搜索: ${query}`, "info");
        try {
            let response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`);
            let data = await response.json();
            let results = data.RelatedTopics?.slice(0, 3).map(t => t.Text).filter(t => t) || [];
            let r = results.length === 0 ? "未找到相关结果" : "搜索结果:\n" + results.join("\n");
            addConsoleLog(`搜索完成，找到 ${results.length} 条结果`, "success");
            return r;
        } catch (e) { addConsoleLog(`搜索失败: ${e.message}`, "error"); return `搜索失败: ${e.message}`; }
    }

    function renderMarkupTags(html) {
        html = html.replace(/<h1>(.*?)<\/h1>/gi, '<h1>$1</h1>');
        html = html.replace(/<h2>(.*?)<\/h2>/gi, '<h2>$1</h2>');
        html = html.replace(/<h3>(.*?)<\/h3>/gi, '<h3>$1</h3>');
        html = html.replace(/<h4>(.*?)<\/h4>/gi, '<h4>$1</h4>');
        html = html.replace(/<h5>(.*?)<\/h5>/gi, '<h5>$1</h5>');
        html = html.replace(/<h6>(.*?)<\/h6>/gi, '<h6>$1</h6>');
        html = html.replace(/<bold>(.*?)<\/bold>/gi, '<strong class="bold">$1</strong>');
        html = html.replace(/<italic>(.*?)<\/italic>/gi, '<em class="italic">$1</em>');
        html = html.replace(/<ul>([\s\S]*?)<\/ul>/gi, (match, content) => {
            let items = content.replace(/<li>(.*?)<\/li>/gi, '<li>$1</li>');
            return `<ul>${items}</ul>`;
        });
        html = html.replace(/<ol>([\s\S]*?)<\/ol>/gi, (match, content) => {
            let items = content.replace(/<li>(.*?)<\/li>/gi, '<li>$1</li>');
            return `<ol>${items}</ol>`;
        });
        html = html.replace(/<quote>(.*?)<\/quote>/gi, '<blockquote>$1</blockquote>');
        html = html.replace(/<hr\/>/gi, '<hr>');
        html = html.replace(/<table>([\s\S]*?)<\/table>/gi, (match, content) => {
            let rows = content.replace(/<tr>([\s\S]*?)<\/tr>/gi, (m, rowContent) => {
                let cells = rowContent.replace(/<th>(.*?)<\/th>/gi, '<th>$1</th>').replace(/<td>(.*?)<\/td>/gi, '<td>$1</td>');
                return `<tr>${cells}</tr>`;
            });
            return `<table>${rows}</table>`;
        });
        return html;
    }

    async function parseAndExecuteTags(fullText) {
        let displayHtml = fullText;
        let feedbacks = [];

        displayHtml = displayHtml.replace(/<thinking>([\s\S]*?)<\/thinking>/g, `<div class="thinking">💭 ${escapeHtml("$1")}</div>`);
        displayHtml = displayHtml.replace(/<highlight>([\s\S]*?)<\/highlight>/g, `<span class="highlight">$1</span>`);
        displayHtml = displayHtml.replace(/<link>([^,]+),(.*?)<\/link>/g, `<a href="$1" target="_blank" style="color:#a5d296;">$2</a>`);
        displayHtml = displayHtml.replace(/<code-html>([\s\S]*?)<\/code-html>/g, `<pre><code>${escapeHtml("$1")}</code></pre>`);
        displayHtml = displayHtml.replace(/<code>([\s\S]*?)<\/code>/g, `<pre><code>${escapeHtml("$1")}</code></pre>`);
        
        const hasTaskDown = fullText.includes("<task-down>");
        const hasWaiting = fullText.includes("<waiting>");
        if (hasTaskDown) displayHtml = displayHtml.replace(/<task-down>/g, '<div class="task-done">✅ 任务完成</div>');
        if (hasWaiting) displayHtml = displayHtml.replace(/<waiting>/g, '<div class="waiting-pill">⏳ 等待用户回复</div>');
        
        const htmlMatch = displayHtml.match(/<html>([\s\S]*?)<\/html>/);
        if (htmlMatch) {
            previewFrame.srcdoc = htmlMatch[1];
            previewModal.classList.remove("hidden");
            displayHtml = displayHtml.replace(/<html>[\s\S]*?<\/html>/, '<button onclick="document.getElementById(\'previewModal\').classList.remove(\'hidden\')" style="background:#f0f7ec; border:none; padding:4px 12px; border-radius:20px;">🌐 预览</button>');
            addConsoleLog("HTML 预览已触发", "success");
        }

        const fileCreateRegex = /<file-create\s+path="([^"]+)"\s*>([\s\S]*?)<\/file-create>/g;
        let m;
        let anyFileOp = false;
        while ((m = fileCreateRegex.exec(fullText)) !== null) {
            anyFileOp = true;
            let result = await executeFileOperation("create", m[1], m[2]);
            feedbacks.push(result);
            addFeedbackMsg(result);
        }
        const fileUpdateRegex = /<file-update\s+path="([^"]+)"\s*>([\s\S]*?)<\/file-update>/g;
        while ((m = fileUpdateRegex.exec(fullText)) !== null) {
            anyFileOp = true;
            let result = await executeFileOperation("update", m[1], m[2]);
            feedbacks.push(result);
            addFeedbackMsg(result);
        }
        const fileDeleteRegex = /<file-delete\s+path="([^"]+)"\s*\/>/g;
        while ((m = fileDeleteRegex.exec(fullText)) !== null) {
            anyFileOp = true;
            let result = await executeFileOperation("delete", m[1]);
            feedbacks.push(result);
            addFeedbackMsg(result);
        }

        const checkRegex = /<check-code\s+lang="([^"]+)"\s*>([\s\S]*?)<\/check-code>/g;
        while ((m = checkRegex.exec(fullText)) !== null) {
            let result = await checkCode(m[2], m[1]);
            feedbacks.push(result);
            addFeedbackMsg(result);
            displayHtml = displayHtml.replace(m[0], `<div class="thinking">🔍 ${escapeHtml(result)}</div>`);
        }

        const httpRegex = /<http\s+url="([^"]+)"\s*(method="([^"]+)")?\s*(\s+body="([^"]*)")?\s*\/>/g;
        while ((m = httpRegex.exec(fullText)) !== null) {
            let result = await httpRequest(m[1], m[3] || "GET", m[5] || null);
            feedbacks.push(result);
            addFeedbackMsg(`🌐 ${m[3] || "GET"} ${m[1]}: ${result.slice(0, 100)}`);
            displayHtml = displayHtml.replace(m[0], `<div class="thinking">🌐 ${escapeHtml(result)}</div>`);
        }

        if (fullText.includes("<get-time/>")) {
            let result = getCurrentTime();
            feedbacks.push(result);
            addFeedbackMsg(result);
            displayHtml = displayHtml.replace(/<get-time\/>/g, `<div class="thinking">⏰ ${escapeHtml(result)}</div>`);
        }

        const calcRegex = /<calc>([\s\S]*?)<\/calc>/g;
        while ((m = calcRegex.exec(fullText)) !== null) {
            let result = calculate(m[1]);
            feedbacks.push(result);
            addFeedbackMsg(result);
            displayHtml = displayHtml.replace(m[0], `<div class="thinking">🧮 ${escapeHtml(result)}</div>`);
        }

        const b64encodeRegex = /<b64encode>([\s\S]*?)<\/b64encode>/g;
        while ((m = b64encodeRegex.exec(fullText)) !== null) {
            let result = encodeBase64(m[1]);
            feedbacks.push(`Base64编码: ${result}`);
            addFeedbackMsg(`🔐 ${result}`);
            displayHtml = displayHtml.replace(m[0], `<div class="thinking">🔐 ${escapeHtml(result)}</div>`);
        }

        const b64decodeRegex = /<b64decode>([\s\S]*?)<\/b64decode>/g;
        while ((m = b64decodeRegex.exec(fullText)) !== null) {
            let result = decodeBase64(m[1]);
            feedbacks.push(`Base64解码: ${result}`);
            addFeedbackMsg(`🔓 ${result}`);
            displayHtml = displayHtml.replace(m[0], `<div class="thinking">🔓 ${escapeHtml(result)}</div>`);
        }

        const searchRegex = /<search>([\s\S]*?)<\/search>/g;
        while ((m = searchRegex.exec(fullText)) !== null) {
            let result = await searchWeb(m[1]);
            feedbacks.push(result);
            addFeedbackMsg(`🔍 ${result.slice(0, 150)}`);
            displayHtml = displayHtml.replace(m[0], `<div class="thinking">🔍 ${escapeHtml(result)}</div>`);
        }

        displayHtml = renderMarkupTags(displayHtml);
        displayHtml = displayHtml.replace(/<file-create[\s\S]*?<\/file-create>/g, "");
        displayHtml = displayHtml.replace(/<file-update[\s\S]*?<\/file-update>/g, "");
        displayHtml = displayHtml.replace(/<file-delete[^>]*\/>/g, "");
        displayHtml = displayHtml.replace(/<check-code[\s\S]*?<\/check-code>/g, "");
        displayHtml = displayHtml.replace(/<http[^>]*\/>/g, "");
        displayHtml = displayHtml.replace(/<calc>[\s\S]*?<\/calc>/g, "");
        displayHtml = displayHtml.replace(/<b64encode>[\s\S]*?<\/b64encode>/g, "");
        displayHtml = displayHtml.replace(/<b64decode>[\s\S]*?<\/b64decode>/g, "");
        displayHtml = displayHtml.replace(/<search>[\s\S]*?<\/search>/g, "");

        let hasOp = (anyFileOp || feedbacks.length > 0);
        return { displayHtml, feedbacks, hasWaiting, hasTaskDown, hasOp };
    }

    async function streamDeepSeek(messages, onChunk) {
        if (!apiKey) throw new Error("请先设置 API Key");
        const startTime = Date.now();
        addConsoleLog(`调用API: ${selectedModel}`, "info");
        const resp = await fetch("https://api.deepseek.com/v1/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
            body: JSON.stringify({ model: selectedModel, messages, stream: true, temperature: 0.7 })
        });
        if (!resp.ok) {
            let errText = await resp.text();
            addConsoleLog(`API错误: ${resp.status} ${errText.slice(0,100)}`, "error");
            throw new Error(`API错误 ${resp.status}: ${errText.slice(0, 150)}`);
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let fullText = "";
        let firstChunk = true;
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop();
            for (let line of lines) {
                if (line.startsWith("data: ")) {
                    const data = line.slice(6);
                    if (data === "[DONE]") {
                        addConsoleLog(`API响应完成 (耗时 ${Date.now()-startTime}ms)`, "success");
                        return fullText;
                    }
                    try {
                        const parsed = JSON.parse(data);
                        const delta = parsed.choices[0]?.delta?.content;
                        if (delta) {
                            fullText += delta;
                            if (onChunk) onChunk(delta);
                            if (firstChunk) { firstChunk = false; addConsoleLog(`收到首个响应块`, "info"); }
                        }
                    } catch(e) {}
                }
            }
        }
        addConsoleLog(`API响应完成 (耗时 ${Date.now()-startTime}ms)`, "success");
        return fullText;
    }

    async function runAgent(initialMsg) {
        if (agentActive) { addFeedbackMsg("已有任务运行中，请停止后重试"); return; }
        agentActive = true;
        statusSpan.innerText = "🔵 运行中";
        addUserMsg(initialMsg);
        addConsoleLog(`新任务: ${initialMsg.substring(0,100)}`, "info");
        
        conversationHistory = [
            { role: "system", content: `你是 MuYanCoding，专业的 AI 编程Agent。绝对禁止使用 Markdown 语法直接回复用户，所有回复必须且只能使用以下专用标签。每次回复只包含一个标签（除了可选的<thinking>外），不能输出任何自然语言解释。

【格式强制】
- 如果需要思考，先输出 <thinking>你的思考</thinking>，然后紧接着输出一个功能标签。
- 功能标签（每次选一个）：
  <file-create path="文件名">内容</file-create>
  <file-update path="文件名">内容</file-update>
  <file-delete path="文件名" />
  <check-code lang="语言">代码</check-code>
  <http url="..." method="GET|POST" body='{"key":"value"}' />
  <get-time/>
  <calc>表达式</calc>
  <b64encode>文本</b64encode>
  <b64decode>编码</b64decode>
  <search>关键词</search>
  <html>完整HTML</html>
  <highlight>文本</highlight>
  <link>url,文字</link>
  <code-html>代码</code-html>
  <code>代码</code>
- 当任务完全完成时，必须输出 <task-down> （单独一个标签，不能和其他标签混合）。
- 当需要用户输入或确认时，输出 <waiting> （单独一个标签）。
- 不要输出任何其他文字，不要输出Markdown，不要输出解释。
- 每次收到系统反馈后，根据反馈决定下一步动作。如果任务未完成，继续输出下一个标签；如果已完成，输出 <task-down> 结束。

你现在的任务是根据用户的需求和系统反馈逐步工作。` },
            { role: "user", content: initialMsg }
        ];

        let step = 0;
        const MAX_STEPS = 15;
        let waiting = false;
        lastReplyHash = "";
        consecutiveSameCount = 0;
        noOperationCount = 0;

        while (agentActive && step < MAX_STEPS) {
            step++;
            try {
                statusSpan.innerText = `🔵 思考中 (${step})`;
                let currentReply = "";
                let agentMsgDiv = addAgentMsgWithStream();
                
                const fullReply = await streamDeepSeek(conversationHistory, (chunk) => {
                    currentReply += chunk;
                    agentMsgDiv.innerHTML += chunk;
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                });
                
                if (!agentActive) break;
                
                let replyHash = fullReply.substring(0, 200);
                if (replyHash === lastReplyHash) {
                    consecutiveSameCount++;
                    if (consecutiveSameCount >= 2) {
                        addFeedbackMsg("⚠️ 检测到重复输出，自动停止任务");
                        addConsoleLog("检测到重复输出，强制停止", "error");
                        break;
                    }
                } else {
                    consecutiveSameCount = 0;
                    lastReplyHash = replyHash;
                }
                
                const { displayHtml, feedbacks, hasWaiting, hasTaskDown, hasOp } = await parseAndExecuteTags(fullReply);
                agentMsgDiv.innerHTML = displayHtml;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                
                conversationHistory.push({ role: "assistant", content: fullReply });
                
                if (feedbacks.length > 0) {
                    let feedbackMsg = "系统反馈:\n" + feedbacks.join("\n");
                    conversationHistory.push({ role: "system", content: feedbackMsg });
                } else if (!hasTaskDown && !hasWaiting && step > 1) {
                    noOperationCount++;
                    if (noOperationCount >= 2) {
                        addFeedbackMsg("⚠️ 连续无有效操作，自动停止");
                        addConsoleLog("连续无有效操作，停止任务", "warn");
                        break;
                    }
                } else {
                    noOperationCount = 0;
                }
                
                if (hasTaskDown) {
                    addFeedbackMsg("🏁 任务完成");
                    addConsoleLog("任务完成标记 <task-down> 触发", "success");
                    break;
                }
                if (hasWaiting) {
                    waiting = true;
                    statusSpan.innerText = "⏸️ 等待回复";
                    addConsoleLog("等待用户回复 (<waiting>)", "info");
                    await new Promise((resolve) => { waitingResolver = resolve; });
                    waiting = false;
                    if (!agentActive) break;
                    const userReply = window._pendingReply;
                    window._pendingReply = null;
                    if (userReply) {
                        conversationHistory.push({ role: "user", content: userReply });
                        addUserMsg(userReply);
                        addConsoleLog(`用户回复: ${userReply.substring(0,80)}`, "info");
                    } else break;
                    statusSpan.innerText = "🔵 继续执行";
                }
            } catch (err) {
                addFeedbackMsg(`❌ 错误: ${err.message}`);
                addConsoleLog(`执行错误: ${err.message}`, "error");
                break;
            }
        }
        if (step >= MAX_STEPS) addFeedbackMsg("⚠️ 达到最大步骤限制，任务自动停止");
        addConsoleLog(`任务结束，共执行 ${step} 步`, "info");
        agentActive = false;
        statusSpan.innerText = "⚪ 空闲";
        if (waitingResolver) waitingResolver();
        waitingResolver = null;
    }

    sendBtn.onclick = async () => {
        if (agentActive) { addFeedbackMsg("请先停止当前任务"); return; }
        let text = promptInput.value.trim();
        if (!text) return;
        promptInput.value = "";
        await runAgent(text);
    };
    stopBtn.onclick = () => {
        if (agentActive) {
            agentActive = false;
            if (waitingResolver) waitingResolver();
            waitingResolver = null;
            addFeedbackMsg("⏹️ 已停止");
            addConsoleLog("用户手动停止任务", "warn");
            statusSpan.innerText = "⚪ 已停止";
        }
    };
    setInterval(() => {
        if (statusSpan.innerText.includes("等待回复") && !document.getElementById("waitBox")) {
            let div = document.createElement("div");
            div.id = "waitBox";
            div.style.cssText = "position:sticky; bottom:10px; background:white; border:1px solid #E5E7EB; border-radius:40px; padding:6px 12px; display:flex; gap:10px; margin:8px 0;";
            div.innerHTML = `<input id="waitInput" placeholder="回复..." style="flex:1; border:none; outline:none;"><button id="waitSend" class="primary">发送</button>`;
            messagesDiv.appendChild(div);
            document.getElementById("waitSend").onclick = () => {
                let val = document.getElementById("waitInput").value.trim();
                if (val && waitingResolver) {
                    window._pendingReply = val;
                    waitingResolver();
                    div.remove();
                }
            };
        } else if (!statusSpan.innerText.includes("等待回复") && document.getElementById("waitBox")) document.getElementById("waitBox")?.remove();
    }, 200);
    addFeedbackMsg("欢迎使用MuYanCoding｜专业的编程Agent");
    addConsoleLog("MuYanCoding 已启动，控制台就绪", "success");
</script>
