<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MuYanCoding | 智能编程助手</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-app: #0f0f12;
            --bg-sidebar: #141416;
            --bg-editor: #1a1a1f;
            --bg-chat: #1e1e24;
            --bg-terminal: #0c0c0e;
            --border: #2a2a2e;
            --border-light: #35353a;
            --text-primary: #ededee;
            --text-secondary: #a1a1aa;
            --text-tertiary: #71717a;
            --accent: #a5d296;
            --accent-dark: #8bb87a;
            --accent-strong: #5ca05c;
            --accent-soft: rgba(165, 210, 150, 0.12);
            --danger: #f87171;
            --success: #34d399;
            --warning: #fbbf24;
            --code-bg: #0f0f14;
            --code-border: #2d2d35;
            --chat-user-bg: #2d2d35;
            --chat-assistant-bg: #25252c;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 8px rgba(0,0,0,0.4);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
        }
        body {
            font-family: var(--font-sans);
            background: var(--bg-app);
            height: 100vh;
            overflow: hidden;
            color: var(--text-primary);
        }
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .top-bar {
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            height: 48px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            font-size: 22px;
        }
        .logo-text {
            font-weight: 600;
            font-size: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .api-panel {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .api-panel input, .api-panel select {
            background: #1a1a1f;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-family: var(--font-sans);
            color: var(--text-primary);
            outline: none;
        }
        .api-panel input:focus, .api-panel select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft);
        }
        button {
            background: #25252c;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 13px;
            font-family: var(--font-sans);
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.15s;
        }
        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #0f0f12;
        }
        button.primary:hover {
            background: var(--accent-dark);
        }
        button.danger {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
            color: var(--danger);
        }
        button.danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        .status-badge {
            background: #1a1a1f;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 12px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .file-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-tertiary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-header-actions {
            display: flex;
            gap: 6px;
        }
        .file-header-actions button {
            padding: 4px 8px;
            font-size: 11px;
            background: transparent;
            border: 1px solid var(--border-light);
        }
        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .tree-node {
            list-style: none;
            margin-left: 0;
            padding-left: 0;
        }
        .tree-node-children {
            padding-left: 20px;
            list-style: none;
        }
        .tree-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 8px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.1s;
            user-select: none;
        }
        .tree-item-content {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            overflow: hidden;
        }
        .tree-item-content span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tree-item:hover {
            background: #2a2a2e;
        }
        .tree-item.active {
            background: var(--accent-soft);
            color: var(--accent);
        }
        .folder-toggle {
            width: 18px;
            text-align: center;
            cursor: pointer;
            color: var(--text-tertiary);
            font-size: 10px;
        }
        .item-icon {
            font-size: 14px;
            width: 20px;
        }
        .item-actions {
            display: none;
            gap: 4px;
        }
        .tree-item:hover .item-actions {
            display: flex;
        }
        .item-actions button {
            background: transparent;
            border: none;
            padding: 2px 6px;
            font-size: 11px;
            color: var(--text-tertiary);
        }
        .item-actions button:hover {
            color: var(--accent);
        }
        .center-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-editor);
            min-width: 0;
        }
        .editor-toolbar {
            padding: 8px 16px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        #editor {
            flex: 1;
            background: var(--bg-editor);
            border: none;
            padding: 16px;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.5;
            resize: none;
            outline: none;
            color: var(--text-primary);
        }
        .right-panel {
            width: 380px;
            background: var(--bg-chat);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            border-radius: 16px;
            padding: 10px 14px;
            max-width: 95%;
            font-size: 13px;
            line-height: 1.5;
            animation: fadeIn 0.2s ease;
        }
        .user-msg {
            background: var(--chat-user-bg);
            color: var(--text-primary);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .agent-msg {
            background: var(--chat-assistant-bg);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-left: 2px solid var(--accent);
        }
        .feedback-msg {
            background: #23232a;
            color: var(--text-tertiary);
            font-size: 12px;
            font-family: var(--font-mono);
            align-self: flex-start;
            border-left: 2px solid var(--success);
        }
        .thinking {
            background: #23232a;
            padding: 6px 10px;
            border-radius: var(--radius-md);
            font-size: 12px;
            font-style: italic;
            border-left: 2px solid var(--warning);
            margin: 6px 0;
        }
        pre {
            background: var(--code-bg);
            border: 1px solid var(--code-border);
            border-radius: var(--radius-md);
            padding: 10px;
            overflow-x: auto;
            font-size: 12px;
            font-family: var(--font-mono);
            margin: 8px 0;
            color: var(--text-secondary);
        }
        .task-done {
            background: var(--success);
            color: #0f0f12;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }
        .waiting-pill {
            background: var(--warning);
            color: #0f0f12;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
        }
        .input-area {
            padding: 16px;
            background: var(--bg-chat);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }
        textarea {
            flex: 1;
            background: #25252c;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 10px 16px;
            font-family: var(--font-sans);
            font-size: 13px;
            resize: none;
            outline: none;
            color: var(--text-primary);
        }
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft);
        }
        .terminal-panel {
            background: var(--bg-terminal);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: height 0.2s ease;
            height: 200px;
        }
        .terminal-panel.collapsed {
            height: 36px;
        }
        .terminal-panel.collapsed .console-log {
            display: none;
        }
        .terminal-header {
            padding: 6px 12px;
            background: #141416;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 12px;
            flex-shrink: 0;
        }
        .terminal-header span {
            cursor: pointer;
            color: var(--text-tertiary);
        }
        .terminal-header span.active {
            color: var(--accent);
        }
        .terminal-header button {
            background: #25252c;
            padding: 2px 10px;
            font-size: 11px;
            margin-left: auto;
        }
        .console-log {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.4;
        }
        .log-entry {
            margin: 2px 0;
            border-left: 2px solid transparent;
            padding-left: 8px;
        }
        .log-info { border-left-color: var(--accent); color: #a1a1aa; }
        .log-error { border-left-color: var(--danger); color: #fca5a5; }
        .log-warn { border-left-color: var(--warning); }
        .log-success { border-left-color: var(--success); }
        .log-time {
            color: var(--text-tertiary);
            margin-right: 10px;
        }
        .collapse-btn {
            background: transparent;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            font-size: 12px;
            padding: 0 6px;
            margin-left: 8px;
        }
        .collapse-btn:hover {
            color: var(--accent);
        }
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background: var(--bg-sidebar);
            border-radius: var(--radius-xl);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--accent);
        }
        .modal-header {
            padding: 12px 20px;
            background: #141416;
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            display: flex;
            justify-content: space-between;
            color: var(--text-primary);
        }
        .modal iframe {
            flex: 1;
            border: none;
            background: white;
        }
        .hidden {
            display: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .agent-msg h1, .agent-msg h2, .agent-msg h3 { font-family: var(--font-sans); font-weight: 500; margin: 0.5rem 0; }
        .agent-msg ul, .agent-msg ol { margin: 0.3rem 0 0.3rem 1.2rem; }
        .agent-msg blockquote { border-left: 2px solid var(--accent); padding-left: 0.8rem; margin: 0.4rem 0; color: var(--text-secondary); }
        .agent-msg code { background: var(--code-bg); padding: 2px 4px; border-radius: 4px; font-family: var(--font-mono); }
        .preview-btn {
            background: var(--accent-soft);
            border: 1px solid var(--border);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--accent);
            cursor: pointer;
        }
        .preview-btn:hover {
            background: var(--accent);
            color: #0f0f12;
        }
        .qr-img {
            max-width: 120px;
            border-radius: var(--radius-md);
            margin: 6px 0;
            background: white;
            padding: 4px;
        }
        #waitBox {
            position: sticky;
            bottom: 8px;
            background: #2a2a2e;
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 6px 12px;
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-sidebar);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 3px;
        }
        .rename-input {
            background: #1a1a1f;
            border: 1px solid var(--accent);
            border-radius: var(--radius-sm);
            padding: 2px 6px;
            color: white;
            font-size: 12px;
            width: 120px;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <div class="logo-area">
            <span class="logo-icon">💚</span>
            <span class="logo-text">MuYanCoding</span>
        </div>
        <div class="api-panel">
            <input type="text" id="apiKey" placeholder="DeepSeek API Key" style="width: 200px;">
            <select id="modelSelect">
                <option value="deepseek-chat">deepseek-chat</option>
                <option value="deepseek-coder">deepseek-coder</option>
                <option value="deepseek-v4-flash">deepseek-v4-flash</option>
                <option value="deepseek-v4-pro">deepseek-v4-pro</option>
            </select>
            <button id="saveKeyBtn" class="primary">保存</button>
            <button id="stopBtn" class="danger">停止</button>
            <div class="status-badge" id="status">⚪ 空闲</div>
        </div>
    </div>
    <div class="main-layout">
        <div class="sidebar">
            <div class="file-header">
                <span>📁 资源管理器</span>
                <div class="file-header-actions">
                    <button id="newFileBtn" title="新建文件">📄</button>
                    <button id="newFolderBtn" title="新建文件夹">📁</button>
                </div>
            </div>
            <div class="file-tree" id="fileTree"></div>
        </div>
        <div class="center-area">
            <div class="editor-toolbar">
                <span id="curFile">未选择文件</span>
                <div style="display: flex; gap: 8px;">
                    <button id="saveFileBtn">💾 保存</button>
                    <button id="downloadBtn">📥 下载</button>
                    <button id="manualPreviewBtn" class="preview-btn hidden">🌐 预览</button>
                </div>
            </div>
            <textarea id="editor" placeholder="编辑代码... MuYanCoding 将自动处理文件操作"></textarea>
        </div>
        <div class="right-panel">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <textarea id="prompt" rows="1" placeholder="描述任务，AI 将使用工具完成..."></textarea>
                <button id="sendBtn" class="primary">发送</button>
            </div>
        </div>
    </div>
    <div class="terminal-panel" id="terminalPanel">
        <div class="terminal-header">
            <span id="consoleTabLog" class="active">📋 执行日志</span>
            <button id="exportPdfBtn">导出 PDF</button>
            <span id="consoleTabClear">🗑️ 清空</span>
            <button id="collapseTerminalBtn" class="collapse-btn" title="折叠/展开">▼</button>
        </div>
        <div class="console-log" id="consoleLog"></div>
    </div>
</div>
<div id="previewModal" class="modal hidden">
    <div class="modal-header"><span>🌐 实时预览</span><button id="closePreview">✖</button></div>
    <iframe id="previewFrame"></iframe>
</div>

<script>
    (function() {
        let virtualFs = {}; 
        let currentFilePath = null;
        let apiKey = localStorage.getItem("muyan_api") || "";
        let selectedModel = "deepseek-chat";
        let agentActive = false;
        let waitingResolver = null;
        let conversationHistory = [];
        let expandedFolders = new Set(); 

        function normalizePath(path) {
            return path.replace(/\\/g, '/').replace(/\/+/g, '/').replace(/^\/+/, '');
        }
        function getDirPath(filePath) {
            let lastSlash = filePath.lastIndexOf('/');
            return lastSlash === -1 ? '' : filePath.substring(0, lastSlash);
        }
        function getBaseName(filePath) {
            let parts = filePath.split('/');
            return parts[parts.length-1];
        }
        function ensureDirExists(dirPath) {
            if (!dirPath) return true;
            const parts = dirPath.split('/');
            let current = '';
            for (let part of parts) {
                if (!part) continue;
                current = current ? current + '/' + part : part;
                if (!virtualFs[current]) {
                    virtualFs[current] = { type: 'folder', children: {}, content: null };
                } else if (virtualFs[current].type !== 'folder') {
                    return false;
                }
            }
            return true;
        }
        function initDefaultFs() {
            if (Object.keys(virtualFs).length === 0) {
                virtualFs['welcome.txt'] = { type: 'file', content: '欢迎使用 MuYanCoding！\n\n你可以新建文件/文件夹，或者让 AI 助手帮你编写代码。', mtime: Date.now() };
                virtualFs['src'] = { type: 'folder', children: {} };
                virtualFs['src/main.js'] = { type: 'file', content: 'console.log("Hello MuYanCoding!");', mtime: Date.now() };
                virtualFs['src/style.css'] = { type: 'file', content: 'body { margin: 0; background: #0f0f12; }', mtime: Date.now() };
                expandedFolders.add('src');
            }
        }
        function buildTree() {
            const tree = { children: {}, type: 'folder' };
            for (let path in virtualFs) {
                if (path === '') continue;
                const parts = path.split('/');
                let current = tree;
                for (let i = 0; i < parts.length; i++) {
                    const part = parts[i];
                    const isLast = i === parts.length-1;
                    if (!current.children[part]) {
                        current.children[part] = { 
                            name: part, 
                            children: {}, 
                            type: isLast ? virtualFs[path].type : 'folder', 
                            fullPath: parts.slice(0,i+1).join('/'), 
                            isVirtual: true,
                            expanded: false
                        };
                    }
                    if (!isLast) {
                        current = current.children[part];
                    } else {
                        current.children[part].itemData = virtualFs[path];
                        current.children[part].fullPath = path;
                    }
                }
            }
            function setExpandedFlag(node) {
                for (let key in node.children) {
                    const child = node.children[key];
                    if (child.type === 'folder') {
                        if (expandedFolders.has(child.fullPath)) {
                            child.expanded = true;
                        } else {
                            child.expanded = false;
                        }
                        setExpandedFlag(child);
                    }
                }
            }
            setExpandedFlag(tree);
            return tree;
        }
        function renderTree(node, container, level = 0) {
            const sorted = Object.keys(node.children).sort((a,b) => {
                const aIsFolder = node.children[a].type === 'folder';
                const bIsFolder = node.children[b].type === 'folder';
                if (aIsFolder !== bIsFolder) return aIsFolder ? -1 : 1;
                return a.localeCompare(b);
            });
            for (let name of sorted) {
                const child = node.children[name];
                const li = document.createElement('li');
                li.className = 'tree-node';
                const div = document.createElement('div');
                div.className = 'tree-item' + (currentFilePath === child.fullPath && child.type === 'file' ? ' active' : '');
                div.dataset.path = child.fullPath;
                div.dataset.type = child.type;
                const contentDiv = document.createElement('div');
                contentDiv.className = 'tree-item-content';
                if (child.type === 'folder') {
                    const toggleSpan = document.createElement('span');
                    toggleSpan.className = 'folder-toggle';
                    toggleSpan.textContent = child.expanded ? '▼' : '▶';
                    toggleSpan.onclick = (e) => {
                        e.stopPropagation();
                        if (child.expanded) {
                            expandedFolders.delete(child.fullPath);
                        } else {
                            expandedFolders.add(child.fullPath);
                        }
                        renderFullTree();
                    };
                    contentDiv.appendChild(toggleSpan);
                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'item-icon';
                    iconSpan.textContent = child.expanded ? '📂' : '📁';
                    contentDiv.appendChild(iconSpan);
                } else {
                    const toggleSpan = document.createElement('span');
                    toggleSpan.className = 'folder-toggle';
                    toggleSpan.textContent = '  ';
                    contentDiv.appendChild(toggleSpan);
                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'item-icon';
                    iconSpan.textContent = '📄';
                    contentDiv.appendChild(iconSpan);
                }
                const nameSpan = document.createElement('span');
                nameSpan.textContent = name;
                contentDiv.appendChild(nameSpan);
                div.appendChild(contentDiv);
                const actions = document.createElement('div');
                actions.className = 'item-actions';

        function createFile(path, content = '') {
            const normalized = normalizePath(path);
            if (virtualFs[normalized]) return false;
            const dir = getDirPath(normalized);
            if (dir && !virtualFs[dir]) ensureDirExists(dir);
            virtualFs[normalized] = { type: 'file', content: content, mtime: Date.now() };
            renderFullTree();
            openFile(normalized);
            addFeedbackMsg(`📄 创建文件: ${normalized}`);
            return true;
        }
        function createFolder(path) {

            if (virtualFs[normalized]) return false;
            const dir = getDirPath(normalized);
            if (dir && !virtualFs[dir]) ensureDirExists(dir);
            virtualFs[normalized] = { type: 'folder', children: {}, mtime: Date.now() };

        function createFileInFolder(folderPath) {
            let name = prompt('文件名:', '新文件.txt');
            if (!name) return;
            if (name.includes('/') || name.includes('\\')) { alert('文件名不能包含路径分隔符'); return; }
            const newPath = folderPath ? folderPath + '/' + name : name;
            createFile(newPath, '');

        function createFolderInFolder(folderPath) {
            let name = prompt('文件夹名:', '新文件夹');
            if (!name) return;

        }
        function renameNode(oldPath, type) {
            let newBase = prompt(`重命名 ${getBaseName(oldPath)}`, getBaseName(oldPath));
            if (!newBase || newBase === getBaseName(oldPath)) return;
            if (newBase.includes('/') || newBase.includes('\\')) { alert('名称不能包含路径分隔符'); return; }
            const dir = getDirPath(oldPath);
            const newPath = dir ? dir + '/' + newBase : newBase;
            if (virtualFs[newPath]) { alert('目标已存在'); return; }
            if (type === 'file') {
                virtualFs[newPath] = { ...virtualFs[oldPath], type: 'file' };
                delete virtualFs[oldPath];
                if (currentFilePath === oldPath) {
                    currentFilePath = newPath;
                    document.getElementById('editor').value = virtualFs[newPath].content || '';
                    document.getElementById('curFile').innerText = newPath;
                }
            } else {
                const childrenToMove = Object.keys(virtualFs).filter(p => p.startsWith(oldPath + '/') || p === oldPath);
                for (let child of childrenToMove) {
                    const relative = child.substring(oldPath.length);
                    const newChildPath = newPath + relative;
                    virtualFs[newChildPath] = virtualFs[child];
                    delete virtualFs[child];
                }
                virtualFs[newPath] = { type: 'folder', mtime: Date.now() };
                if (currentFilePath && currentFilePath.startsWith(oldPath)) {
                    currentFilePath = newPath + currentFilePath.substring(oldPath.length);
                    if (virtualFs[currentFilePath]?.type === 'file') document.getElementById('editor').value = virtualFs[currentFilePath].content || '';
                    document.getElementById('curFile').innerText = currentFilePath;
                }
                if (expandedFolders.has(oldPath)) {
                    expandedFolders.delete(oldPath);
                    expandedFolders.add(newPath);
                }
                delete virtualFs[oldPath];
            }
            renderFullTree();
            addFeedbackMsg(`✏️ 已重命名: ${oldPath} → ${newPath}`);
        }
        function deleteNode(path) {
            if (!confirm(`确定删除 ${path} 吗？`)) return;
            const toDelete = Object.keys(virtualFs).filter(p => p === path || p.startsWith(path + '/'));
            for (let p of toDelete) {
                if (expandedFolders.has(p)) expandedFolders.delete(p);
                delete virtualFs[p];
            }
            if (currentFilePath && (currentFilePath === path || currentFilePath.startsWith(path + '/'))) {
                currentFilePath = null;
                document.getElementById('editor').value = '';
                document.getElementById('curFile').innerText = '未选择文件';
                document.getElementById('manualPreviewBtn').classList.add('hidden');
            }
            renderFullTree();
            addFeedbackMsg(`🗑️ 已删除: ${path}`);
        }
        function moveNode(sourcePath, targetPath) {
            const srcNorm = normalizePath(sourcePath);
            const tgtNorm = normalizePath(targetPath);
            if (!virtualFs[srcNorm]) return `❌ 源路径不存在: ${srcNorm}`;
            if (virtualFs[tgtNorm]) return `❌ 目标路径已存在: ${tgtNorm}`;
            if (srcNorm === tgtNorm) return `❌ 源路径和目标路径相同`;
            if (tgtNorm.startsWith(srcNorm + '/')) return `❌ 不能将文件夹移动到自身内部`;
            const targetDir = getDirPath(tgtNorm);
            if (targetDir && !virtualFs[targetDir]) ensureDirExists(targetDir);
            const type = virtualFs[srcNorm].type;
            if (type === 'file') {
                virtualFs[tgtNorm] = { ...virtualFs[srcNorm], type: 'file' };
                delete virtualFs[srcNorm];
                if (currentFilePath === srcNorm) {
                    currentFilePath = tgtNorm;
                    document.getElementById('editor').value = virtualFs[tgtNorm].content || '';
                    document.getElementById('curFile').innerText = tgtNorm;
                }
            } else {
                const childrenToMove = Object.keys(virtualFs).filter(p => p === srcNorm || p.startsWith(srcNorm + '/'));
                for (let child of childrenToMove) {
                    const relative = child.substring(srcNorm.length);
                    const newChildPath = tgtNorm + relative;
                    virtualFs[newChildPath] = virtualFs[child];
                    delete virtualFs[child];
                }
                if (expandedFolders.has(srcNorm)) {
                    expandedFolders.delete(srcNorm);
                    expandedFolders.add(tgtNorm);
                }
                if (currentFilePath && currentFilePath.startsWith(srcNorm)) {
                    currentFilePath = tgtNorm + currentFilePath.substring(srcNorm.length);
                    if (virtualFs[currentFilePath]?.type === 'file') document.getElementById('editor').value = virtualFs[currentFilePath].content || '';
                    document.getElementById('curFile').innerText = currentFilePath;
                }
            }
            renderFullTree();
            return `✅ 已移动: ${srcNorm} → ${tgtNorm}`;
        }

        window.executeFileOperation = async function(operation, path, content = null, target = null) {
            const normPath = normalizePath(path);
            if (operation === "create") {
                if (virtualFs[normPath]) return `❌ 文件 ${normPath} 已存在`;
                createFile(normPath, content || '');
                return `✅ 文件已创建: ${normPath}`;
            }
            if (operation === "update") {
                if (!virtualFs[normPath] || virtualFs[normPath].type !== 'file') return `❌ 文件不存在: ${normPath}`;
                virtualFs[normPath].content = content;
                if (currentFilePath === normPath) document.getElementById('editor').value = content;
                renderFullTree();
                return `✅ 已更新: ${normPath}`;
            }
            if (operation === "delete") {
                deleteNode(normPath);
                return `✅ 已删除: ${normPath}`;
            }
            if (operation === "create_folder") {
                if (virtualFs[normPath]) return `❌ 文件夹 ${normPath} 已存在`;
                createFolder(normPath);
                return `✅ 文件夹已创建: ${normPath}`;
            }
            if (operation === "rename") {
                const newPath = normalizePath(target);
                if (!virtualFs[normPath]) return `❌ 路径不存在: ${normPath}`;
                if (virtualFs[newPath]) return `❌ 目标已存在: ${newPath}`;
                renameNode(normPath, virtualFs[normPath].type);
                return `✅ 已重命名: ${normPath} → ${newPath}`;
            }
            if (operation === "move") {
                const src = normPath;
                const dst = normalizePath(target);
                return moveNode(src, dst);
            }
            return "未知操作";
        };

        async function streamDeepSeek(messages, onChunk) { 
            if (!apiKey) throw new Error('请设置 API Key'); 
            const resp = await fetch('https://api.deepseek.com/v1/chat/completions', { 
                method:'POST', 
                headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`}, 
                body:JSON.stringify({ model:selectedModel, messages, stream:true, temperature:0.7 }) 
            }); 
            if (!resp.ok) throw new Error(`API错误 ${resp.status}`); 
            const reader = resp.body.getReader(); 
            const decoder = new TextDecoder(); 
            let buffer='', full=''; 
            while(true){ 
                const {done,value}=await reader.read(); 
                if(done) break; 
                buffer+=decoder.decode(value,{stream:true}); 
                const lines=buffer.split('\n'); 
                buffer=lines.pop(); 
                for(let line of lines){ 
                    if(line.startsWith('data: ')){ 
                        const data=line.slice(6); 
                        if(data==='[DONE]') return full; 
                        try{ 
                            const parsed=JSON.parse(data); 
                            const delta=parsed.choices[0]?.delta?.content; 
                            if(delta){ full+=delta; if(onChunk) onChunk(delta); } 
                        }catch(e){} 
                    } 
                } 
            } 
            return full; 
        }

        const SYSTEM_PROMPT_FULL = `你是 MuYanCoding，一个专业且功能完整的 AI 编程 Agent。你必须严格遵守以下输出格式和工具使用规范，禁止输出任何不符合规范的内容。

        async function runAgent(initialMsg) { 
            if (agentActive) return; 
            agentActive=true; 
            document.getElementById('status').innerText='🔵 运行中'; 
            addUserMsg(initialMsg); 
            conversationHistory=[{role:'system',content:SYSTEM_PROMPT_FULL},{role:'user',content:initialMsg}]; 
            let step=0; 
            while(agentActive && step<20){ 
                step++; 
                document.getElementById('status').innerText=`🔵 思考中 (${step})`; 
                let agentDiv=addAgentMsgWithStream(); 
                let full=''; 
                try{ 
                    full=await streamDeepSeek(conversationHistory, (chunk)=>{ 
                        agentDiv.innerHTML+=chunk; 
                        agentDiv.scrollIntoView({behavior:'smooth',block:'nearest'}); 
                    }); 
                }catch(err){ 
                    addFeedbackMsg(`❌ API错误: ${err.message}`); 
                    break; 
                } 
                const {displayHtml,feedbacks,hasTaskDown,hasWaiting}=await parseAndExecuteTags(full); 
                agentDiv.innerHTML=displayHtml; 
                conversationHistory.push({role:'assistant',content:full}); 
                if(feedbacks.length) conversationHistory.push({role:'system',content:'反馈:\n'+feedbacks.join('\n')}); 
                if(hasTaskDown){ addFeedbackMsg('🏁 任务完成'); break; } 
                if(hasWaiting){ 
                    document.getElementById('status').innerText='⏸️ 等待回复'; 
                    await new Promise(r=>{ waitingResolver=r; }); 
                    if(window._pendingReply){ 
                        conversationHistory.push({role:'user',content:window._pendingReply}); 
                        addUserMsg(window._pendingReply); 
                        window._pendingReply=null; 
                    } 
                    document.getElementById('status').innerText='🔵 继续执行'; 
                } 
            } 
            agentActive=false; 
            document.getElementById('status').innerText='⚪ 空闲'; 
        }

        async function exportToPdf() { 
            const msgs=document.getElementById('messages'); 
            if(!msgs.children.length){addFeedbackMsg('无对话');return;} 
            addFeedbackMsg('生成PDF...'); 
            const clone=document.createElement('div'); 
            clone.style.position='absolute';clone.style.left='-9999px';clone.style.top='0';clone.style.width='800px';clone.style.background='white';clone.style.padding='30px'; 
            const header=document.createElement('div'); 
            header.innerHTML=`<h1>MuYanCoding 对话</h1><p>${new Date().toLocaleString()}</p>`; 
            clone.appendChild(header); 
            const msgsClone=msgs.cloneNode(true); 
            for(let img of msgsClone.querySelectorAll('img')) try{ const c=await html2canvas(img); img.src=c.toDataURL(); }catch(e){} 
            clone.appendChild(msgsClone); 
            document.body.appendChild(clone); 
            try{ 
                const canvas=await html2canvas(clone,{scale:2}); 
                const imgData=canvas.toDataURL(); 
                const {jsPDF}=window.jspdf; 
                const pdf=new jsPDF(); 
                const imgWidth=190; 
                const imgHeight=(canvas.height*imgWidth)/canvas.width; 
                pdf.addImage(imgData,'PNG',10,0,imgWidth,imgHeight); 
                pdf.save(`muyan_${Date.now()}.pdf`); 
                addFeedbackMsg('PDF已下载'); 
            }catch(e){addFeedbackMsg('导出失败');}finally{document.body.removeChild(clone);} 
        }

        setInterval(()=>{ 
            if(document.getElementById('status').innerText.includes('等待回复') && !document.getElementById('waitBox')){ 
                const div=document.createElement('div'); 
                div.id='waitBox'; 
                div.innerHTML=`<input id="waitInput" placeholder="回复..." style="flex:1;background:transparent;border:none;color:white;"><button id="waitSend" class="primary">发送</button>`; 
                document.getElementById('messages').appendChild(div); 
                document.getElementById('waitSend').onclick=()=>{ 
                    const val=document.getElementById('waitInput').value.trim(); 
                    if(val && waitingResolver){ 
                        window._pendingReply=val; 
                        waitingResolver(); 
                        div.remove(); 
                    } 
                }; 
            } else if(!document.getElementById('status').innerText.includes('等待回复') && document.getElementById('waitBox')) document.getElementById('waitBox')?.remove(); 
        },200);
    })();
