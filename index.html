<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MuYanCoding｜编程Agent</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --muyan-green: #a5d296;
            --muyan-green-dark: #8bb87a;
            --muyan-green-glow: rgba(165, 210, 150, 0.25);
            --muyan-green-soft: #f0f7ec;
            --bg-gradient: radial-gradient(circle at 10% 20%, rgba(165,210,150,0.05) 0%, #FFFFFF 90%);
            --border-light: #E5E7EB;
            --text-primary: #1F2937;
            --text-secondary: #4B5563;
            --success: #10B981;
            --warning: #F59E0B;
            --error: #EF4444;
            --console-bg: #1e1e2f;
            --console-text: #cbd5e6;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            overflow: hidden;
        }
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .toolbar {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-light);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.3rem;
            background: linear-gradient(135deg, var(--muyan-green), #6b9e56);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .api-panel {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .api-panel input, .api-panel select {
            background: white;
            border: 1px solid var(--border-light);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            outline: none;
        }
        button {
            background: #F3F4F6;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        button.primary {
            background: var(--muyan-green);
            color: #1F2937;
        }
        button.primary:hover {
            background: var(--muyan-green-dark);
        }
        button.danger {
            background: #FEF2F2;
            color: var(--error);
        }
        .status-badge {
            background: #F3F4F6;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-family: monospace;
        }
        .main-split {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 1px;
            background: var(--border-light);
        }
        .workspace {
            width: 42%;
            min-width: 300px;
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .file-header {
            padding: 14px 16px;
            background: #F9FAFB;
            border-bottom: 1px solid var(--border-light);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }
        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-family: monospace;
            font-size: 0.8rem;
        }
        .file-item:hover {
            background: var(--muyan-green-soft);
        }
        .file-item.active {
            background: var(--muyan-green-soft);
            border-left: 3px solid var(--muyan-green);
        }
        .editor-area {
            background: white;
            border-top: 1px solid var(--border-light);
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .editor-toolbar {
            padding: 10px 16px;
            background: #F9FAFB;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
        }
        #editor {
            flex: 1;
            border: none;
            padding: 16px;
            font-family: 'SF Mono', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            background: #FEFEFE;
        }
        .agent-panel {
            flex: 1;
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg {
            border-radius: 20px;
            padding: 12px 18px;
            max-width: 90%;
            animation: fadeIn 0.2s ease;
        }
        .user-msg {
            background: var(--muyan-green);
            color: #1F2937;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }
        .agent-msg {
            background: #F9FAFB;
            border: 1px solid var(--border-light);
            align-self: flex-start;
            border-left: 3px solid var(--muyan-green);
            white-space: normal;
            word-wrap: break-word;
        }
        .feedback-msg {
            background: #F3F4F6;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-family: monospace;
            align-self: flex-start;
            border-left: 2px solid var(--success);
        }
        .thinking {
            background: #F3F4F6;
            padding: 6px 12px;
            border-radius: 12px;
            font-style: italic;
            font-size: 0.8rem;
            border-left: 2px solid var(--warning);
            margin: 6px 0;
        }
        .highlight {
            background: rgba(165,210,150,0.3);
            border-radius: 6px;
            padding: 0 3px;
        }
        pre {
            background: #1E293B;
            color: #E2E8F0;
            border-radius: 12px;
            padding: 10px;
            overflow-x: auto;
            font-size: 12px;
            margin: 8px 0;
        }
        .task-done {
            color: var(--success);
            background: #D1FAE5;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        .waiting-pill {
            background: #FEF3C7;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        .input-area {
            padding: 16px;
            background: white;
            border-top: 1px solid var(--border-light);
            display: flex;
            gap: 12px;
        }
        textarea {
            flex: 1;
            background: #F9FAFB;
            border: 1px solid var(--border-light);
            border-radius: 28px;
            padding: 10px 18px;
            font-family: inherit;
            resize: none;
            outline: none;
        }
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background: white;
            border-radius: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            border: 1px solid var(--muyan-green);
        }
        .modal-header {
            padding: 12px 20px;
            background: #F9FAFB;
            border-radius: 24px 24px 0 0;
            display: flex;
            justify-content: space-between;
        }
        .modal iframe {
            flex: 1;
            border: none;
        }
        .hidden {
            display: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .agent-msg h1 { font-size: 1.8rem; font-weight: 700; margin: 0.5rem 0; }
        .agent-msg h2 { font-size: 1.5rem; font-weight: 600; margin: 0.5rem 0; }
        .agent-msg h3 { font-size: 1.3rem; font-weight: 600; margin: 0.4rem 0; }
        .agent-msg h4 { font-size: 1.1rem; font-weight: 600; margin: 0.4rem 0; }
        .agent-msg h5 { font-size: 1rem; font-weight: 600; margin: 0.3rem 0; }
        .agent-msg h6 { font-size: 0.9rem; font-weight: 600; margin: 0.3rem 0; }
        .agent-msg ul, .agent-msg ol { margin: 0.5rem 0 0.5rem 1.5rem; }
        .agent-msg li { margin: 0.2rem 0; }
        .agent-msg blockquote { border-left: 3px solid var(--muyan-green); padding-left: 1rem; margin: 0.5rem 0; color: var(--text-secondary); }
        .agent-msg hr { margin: 1rem 0; border: none; border-top: 1px solid var(--border-light); }
        .agent-msg table { border-collapse: collapse; width: 100%; margin: 0.5rem 0; }
        .agent-msg th, .agent-msg td { border: 1px solid var(--border-light); padding: 6px 10px; text-align: left; }
        .agent-msg th { background: var(--muyan-green-soft); }
        .bold { font-weight: 700; }
        .italic { font-style: italic; }
        .preview-btn {
            background: var(--muyan-green);
            border: none;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            margin-left: 8px;
        }
        .preview-btn:hover {
            background: var(--muyan-green-dark);
        }
        .console-area {
            background: var(--console-bg);
            color: var(--console-text);
            border-top: 1px solid var(--border-light);
            height: 200px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: 'SF Mono', monospace;
            font-size: 12px;
        }
        .console-header {
            padding: 6px 12px;
            background: #2a2a3b;
            font-weight: 500;
            border-bottom: 1px solid #3a3a4b;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .console-header span {
            cursor: pointer;
            opacity: 0.7;
        }
        .console-header span.active {
            opacity: 1;
            color: var(--muyan-green);
        }
        .console-header button {
            background: #3a3a4b;
            color: #e2e8f0;
            padding: 4px 12px;
            font-size: 0.7rem;
            border-radius: 20px;
            margin-left: auto;
        }
        .console-log {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            line-height: 1.5;
        }
        .log-entry {
            margin: 4px 0;
            border-left: 2px solid transparent;
            padding-left: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log-info { border-left-color: var(--muyan-green); }
        .log-error { border-left-color: var(--error); color: #fca5a5; }
        .log-warn { border-left-color: var(--warning); }
        .log-success { border-left-color: var(--success); }
        .log-time {
            color: #8892b0;
            margin-right: 10px;
        }
        .qr-img {
            max-width: 200px;
            border-radius: 8px;
            margin: 8px 0;
        }
        .pdf-export-container {
            background: white;
            padding: 20px;
            max-width: 100%;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="toolbar">
        <div class="logo">💚 MuYanCoding</div>
        <div class="api-panel">
            <input type="text" id="apiKey" placeholder="DeepSeek API Key" style="width: 220px;">
            <select id="modelSelect">
                <option value="deepseek-chat">deepseek-chat</option>
                <option value="deepseek-coder">deepseek-coder</option>
                <option value="deepseek-v4-flash">deepseek-v4-flash</option>
                <option value="deepseek-v4-pro">deepseek-v4-pro</option>
            </select>
            <button id="saveKeyBtn" class="primary">保存</button>
            <button id="stopBtn" class="danger">停止</button>
            <div class="status-badge" id="status">⚪ 空闲</div>
        </div>
    </div>
    <div class="main-split">
        <div class="workspace">
            <div class="file-header">
                <span>📁 工作台</span>
                <button id="newFileBtn">+ 新建</button>
            </div>
            <div class="file-tree" id="fileTree"></div>
            <div class="editor-area">
                <div class="editor-toolbar">
                    <span id="curFile">未选择</span>
                    <div>
                        <button id="saveFileBtn">💾 保存</button>
                        <button id="downloadBtn">📥 下载</button>
                        <button id="manualPreviewBtn" class="preview-btn hidden">🌐 预览</button>
                    </div>
                </div>
                <textarea id="editor" placeholder="MuYanCoding 会直接编辑文件"></textarea>
            </div>
        </div>
        <div class="agent-panel">
            <div class="messages" id="messages"></div>
            <div class="console-area">
                <div class="console-header">
                    <span id="consoleTabLog" class="active">📋 执行日志</span>
                    <button id="exportPdfBtn" style="background:#4a4a5a;">📄 导出PDF</button>
                    <span id="consoleTabClear" style="margin-left:auto;">🗑️ 清空</span>
                </div>
                <div class="console-log" id="consoleLog"></div>
            </div>
            <div class="input-area">
                <textarea id="prompt" rows="1" placeholder="描述任务，我会用工作台和真实工具完成"></textarea>
                <button id="sendBtn" class="primary">发送</button>
            </div>
        </div>
    </div>
</div>
<div id="previewModal" class="modal hidden">
    <div class="modal-header"><span>🌐 实时预览</span><button id="closePreview">✖</button></div>
    <iframe id="previewFrame"></iframe>
</div>

<script>
    (function() {
        let virtualFs = {};
        let currentFile = null;
        let apiKey = localStorage.getItem("muyan_api") || "";
        let selectedModel = "deepseek-chat";
        let agentActive = false;
        let waitingResolver = null;
        let conversationHistory = [];
        
        const fileTreeDiv = document.getElementById("fileTree");
        const editor = document.getElementById("editor");
        const curFileSpan = document.getElementById("curFile");
        const messagesDiv = document.getElementById("messages");
        const promptInput = document.getElementById("prompt");
        const sendBtn = document.getElementById("sendBtn");
        const stopBtn = document.getElementById("stopBtn");
        const statusSpan = document.getElementById("status");
        const newFileBtn = document.getElementById("newFileBtn");
        const saveFileBtn = document.getElementById("saveFileBtn");
        const downloadBtn = document.getElementById("downloadBtn");
        const previewModal = document.getElementById("previewModal");
        const previewFrame = document.getElementById("previewFrame");
        const closePreview = document.getElementById("closePreview");
        const apiKeyInput = document.getElementById("apiKey");
        const modelSelect = document.getElementById("modelSelect");
        const saveKeyBtn = document.getElementById("saveKeyBtn");
        const manualPreviewBtn = document.getElementById("manualPreviewBtn");
        const consoleLogDiv = document.getElementById("consoleLog");
        const consoleTabClear = document.getElementById("consoleTabClear");
        const exportPdfBtn = document.getElementById("exportPdfBtn");
        
        function escapeHtml(s) { if (!s) return ''; return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]); }
        
        function addConsoleLog(message, type = "info") {
            const entry = document.createElement("div");
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="log-time">[${time}]</span> ${escapeHtml(message)}`;
            consoleLogDiv.appendChild(entry);
            entry.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
        
        function addFeedbackMsg(text) {
            let div = document.createElement("div");
            div.className = "msg feedback-msg";
            div.innerHTML = `🔧 ${escapeHtml(text)}`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function addUserMsg(text) {
            let div = document.createElement("div");
            div.className = "msg user-msg";
            div.innerHTML = `<div>${escapeHtml(text)}</div>`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function addAgentMsgWithStream() {
            let div = document.createElement("div");
            div.className = "msg agent-msg";
            div.innerHTML = "";
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return div;
        }
        
        function renderFileTree() {
            fileTreeDiv.innerHTML = "";
            if (Object.keys(virtualFs).length === 0) {
                let emptyDiv = document.createElement("div");
                emptyDiv.style.padding = "20px";
                emptyDiv.style.textAlign = "center";
                emptyDiv.style.color = "var(--text-secondary)";
                emptyDiv.innerText = "暂无文件，点击 + 新建";
                fileTreeDiv.appendChild(emptyDiv);
            } else {
                Object.keys(virtualFs).sort().forEach(p => {
                    const div = document.createElement("div");
                    div.className = "file-item" + (currentFile === p ? " active" : "");
                    div.innerHTML = `<span>📄 ${p}</span><button class="delBtn" data-path="${p}" style="background:none; border:none; color:#EF4444;">🗑️</button>`;
                    div.onclick = (e) => { if (e.target.classList.contains("delBtn")) return; selectFile(p); };
                    const del = div.querySelector(".delBtn");
                    del.onclick = (e) => { e.stopPropagation(); deleteFile(p); };
                    fileTreeDiv.appendChild(div);
                });
            }
            if (currentFile && virtualFs[currentFile]) editor.value = virtualFs[currentFile].content;
            else editor.value = "";
            curFileSpan.innerText = currentFile || "未选择";
            if (currentFile && (currentFile.endsWith(".html") || currentFile.endsWith(".htm"))) manualPreviewBtn.classList.remove("hidden");
            else manualPreviewBtn.classList.add("hidden");
        }
        
        function selectFile(p) { currentFile = p; editor.value = virtualFs[p].content; curFileSpan.innerText = p; renderFileTree(); addConsoleLog(`打开文件: ${p}`, "info"); }
        
        function saveCurrent() {
            if (currentFile && virtualFs[currentFile]) { virtualFs[currentFile].content = editor.value; addFeedbackMsg(`💾 已保存 ${currentFile}`); addConsoleLog(`保存文件: ${currentFile}`, "success"); renderFileTree(); }
            else if (currentFile && !virtualFs[currentFile]) { virtualFs[currentFile] = { content: editor.value }; addFeedbackMsg(`📄 创建并保存 ${currentFile}`); renderFileTree(); }
            else addFeedbackMsg("请先选择或创建文件");
        }
        
        function deleteFile(p) {
            if (confirm(`删除 ${p}?`)) {
                delete virtualFs[p];
                if (currentFile === p) { let keys = Object.keys(virtualFs); currentFile = keys[0] || null; if (currentFile) editor.value = virtualFs[currentFile].content; else editor.value = ""; }
                renderFileTree(); addFeedbackMsg(`🗑️ 已删除 ${p}`); addConsoleLog(`删除文件: ${p}`, "warn");
            }
        }
        
        function newFile() { let name = prompt("文件名:", "newfile.txt"); if (name && !virtualFs[name]) { virtualFs[name] = { content: "" }; currentFile = name; editor.value = ""; renderFileTree(); addFeedbackMsg(`📄 创建 ${name}`); } else if (name) alert("文件已存在"); }
        
        async function executeFileOperation(operation, path, content = null) {
            if (operation === "create") { if (virtualFs[path]) return `❌ 文件 ${path} 已存在`; virtualFs[path] = { content: content || "" }; renderFileTree(); return `✅ 文件已创建: ${path}`; }
            if (operation === "update") { if (!virtualFs[path]) return `❌ 文件不存在`; virtualFs[path].content = content; if (currentFile === path) editor.value = content; renderFileTree(); return `✅ 已更新: ${path}`; }
            if (operation === "delete") { delete virtualFs[path]; if (currentFile === path) { let keys = Object.keys(virtualFs); currentFile = keys[0] || null; if(currentFile) editor.value = virtualFs[currentFile].content; else editor.value = ""; } renderFileTree(); return `✅ 已删除: ${path}`; }
            return "未知操作";
        }
        
        async function parseAndExecuteTags(fullText) {
            let displayHtml = fullText;
            let feedbacks = [];
            displayHtml = displayHtml.replace(/<thinking>([\s\S]*?)<\/thinking>/g, `<div class="thinking">💭 ${escapeHtml("$1")}</div>`);
            let m;
            
            const fileCreateRegex = /<file-create\s+path="([^"]+)"\s*>([\s\S]*?)<\/file-create>/g;
            while ((m = fileCreateRegex.exec(fullText)) !== null) { let r = await executeFileOperation("create", m[1], m[2]); feedbacks.push(r); addFeedbackMsg(r); displayHtml = displayHtml.replace(m[0], ''); }
            const fileUpdateRegex = /<file-update\s+path="([^"]+)"\s*>([\s\S]*?)<\/file-update>/g;
            while ((m = fileUpdateRegex.exec(fullText)) !== null) { let r = await executeFileOperation("update", m[1], m[2]); feedbacks.push(r); addFeedbackMsg(r); displayHtml = displayHtml.replace(m[0], ''); }
            const fileDeleteRegex = /<file-delete\s+path="([^"]+)"\s*\/>/g;
            while ((m = fileDeleteRegex.exec(fullText)) !== null) { let r = await executeFileOperation("delete", m[1]); feedbacks.push(r); addFeedbackMsg(r); displayHtml = displayHtml.replace(m[0], ''); }
            const getTimeRegex = /<get-time\s*\/>/g;
            if (getTimeRegex.test(fullText)) {
                let now = new Date();
                let beijingTime = new Date(now.getTime() + (8 * 60 * 60 * 1000));
                let timeStr = beijingTime.toISOString().replace('T', ' ').slice(0, 19);
                let result = `✅ 当前时间: ${timeStr}`;
                feedbacks.push(result);
                addFeedbackMsg(result);
                displayHtml = displayHtml.replace(getTimeRegex, `<div class="thinking">⏱️ ${timeStr}</div>`);
            }
            const calcRegex = /<calc>([\s\S]*?)<\/calc>/g;
            while ((m = calcRegex.exec(fullText)) !== null) {
                try {
                    let expr = m[1];
                    let result = eval(expr);
                    let resultMsg = `✅ 计算结果: ${expr} = ${result}`;
                    feedbacks.push(resultMsg);
                    addFeedbackMsg(resultMsg);
                    displayHtml = displayHtml.replace(m[0], `<div class="thinking">🧮 ${resultMsg}</div>`);
                } catch(e) {
                    let errMsg = `❌ 计算错误: ${e.message}`;
                    feedbacks.push(errMsg);
                    addFeedbackMsg(errMsg);
                }
            }
            
            const getClipRegex = /<get-clipboard\s*\/>/g;
            if (getClipRegex.test(fullText)) {
                try {
                    const text = await navigator.clipboard.readText();
                    let result = `📋 剪贴板内容: ${text.substring(0, 200)}${text.length > 200 ? '...' : ''}`;
                    feedbacks.push(result);
                    addFeedbackMsg(result);
                    displayHtml = displayHtml.replace(getClipRegex, `<div class="thinking">📋 ${escapeHtml(result)}</div>`);
                } catch(e) {
                    let errMsg = `❌ 读取剪贴板失败: ${e.message}`;
                    feedbacks.push(errMsg);
                    addFeedbackMsg(errMsg);
                }
            }
            
            const setClipRegex = /<set-clipboard>([\s\S]*?)<\/set-clipboard>/g;
            while ((m = setClipRegex.exec(fullText)) !== null) {
                try {
                    await navigator.clipboard.writeText(m[1]);
                    let result = `✅ 已写入剪贴板: ${m[1].substring(0, 100)}${m[1].length > 100 ? '...' : ''}`;
                    feedbacks.push(result);
                    addFeedbackMsg(result);

            const uuidRegex = /<uuid-generate\s*\/>/g;
            if (uuidRegex.test(fullText)) {
                const uuid = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                    let r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
                let result = `🔑 新UUID: ${uuid}`;
                feedbacks.push(result);
                addFeedbackMsg(result);
                displayHtml = displayHtml.replace(uuidRegex, `<div class="thinking">🔑 ${escapeHtml(result)}</div>`);
            }
            
            const b64encodeRegex = /<base64-encode>([\s\S]*?)<\/base64-encode>/g;
            while ((m = b64encodeRegex.exec(fullText)) !== null) {
                try {
                    let encoded = btoa(unescape(encodeURIComponent(m[1])));
                    let result = `✅ Base64编码: ${encoded.substring(0, 150)}${encoded.length > 150 ? '...' : ''}`;
                    feedbacks.push(result);

                    feedbacks.push(errMsg);
                    addFeedbackMsg(errMsg);
                }
            }
            
            const b64decodeRegex = /<base64-decode>([\s\S]*?)<\/base64-decode>/g;
            while ((m = b64decodeRegex.exec(fullText)) !== null) {
                try {
                    let decoded = decodeURIComponent(escape(atob(m[1])));
                    let result = `✅ Base64解码: ${decoded.substring(0, 200)}${decoded.length > 200 ? '...' : ''}`;
                    feedbacks.push(result);
                    addFeedbackMsg(result);
                    displayHtml = displayHtml.replace(m[0], `<div class="thinking">🔓 ${escapeHtml(result)}</div>`);

            const fetchRegex = /<fetch-url\s+url="([^"]+)"\s*\/>/g;
            while ((m = fetchRegex.exec(fullText)) !== null) {

                    let controller = new AbortController();

                    let resp = await fetch(url, { signal: controller.signal });

                    let truncated = text.substring(0, 500);

                    feedbacks.push(errMsg);

                }
            }
            
            const qrRegex = /<qr-code(?:\s+size="(\d+)")?>([\s\S]*?)<\/qr-code>/g;
            while ((m = qrRegex.exec(fullText)) !== null) {
                let size = m[1] ? parseInt(m[1]) : 150;
                let qrData = m[2].trim();
                if (qrData) {
                    let qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(qrData)}`;

                    feedbacks.push(result);

                } else {

            }
            
            const textStatsRegex = /<text-statistics>([\s\S]*?)<\/text-statistics>/g;
            while ((m = textStatsRegex.exec(fullText)) !== null) {
                let text = m[1];

                let words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
                let lines = text.split(/\r?\n/).length;
                let readingTime = Math.ceil(words / 200);
                let result = `📊 文本统计: 字符数=${chars}, 单词数=${words}, 行数=${lines}, 预计阅读时间=${readingTime}分钟`;
                feedbacks.push(result);
                addFeedbackMsg(result);
                displayHtml = displayHtml.replace(m[0], `<div class="thinking">📊 ${escapeHtml(result)}</div>`);
            }
            
            const jsonValidatorRegex = /<json-validator>([\s\S]*?)<\/json-validator>/g;
            while ((m = jsonValidatorRegex.exec(fullText)) !== null) {
                let jsonStr = m[1];
                try {
                    let parsed = JSON.parse(jsonStr);
                    let formatted = JSON.stringify(parsed, null, 2);
                    let result = `✅ JSON 有效，格式化结果:\n${formatted.substring(0, 500)}${formatted.length>500?'...':''}`;
                    feedbacks.push(result);
                    addFeedbackMsg(result);
                    displayHtml = displayHtml.replace(m[0], `<div class="thinking">📐 <pre>${escapeHtml(formatted)}</pre></div>`);
                } catch(e) {
                    let errMsg = `❌ JSON 无效: ${e.message}`;
                    feedbacks.push(errMsg);
                    addFeedbackMsg(errMsg);
                }
            }
            
            const taskDownRegex = /<task-down\s*\/?>|<task-done\s*\/?>/;
            const hasTaskDown = taskDownRegex.test(fullText);

            if (hasTaskDown) displayHtml = displayHtml.replace(taskDownRegex, '<div class="task-done">✅ 任务完成</div>');
            if (hasWaiting) displayHtml = displayHtml.replace(/<waiting>|<wait-user\s*\/?>/, '<div class="waiting-pill">⏳ 等待用户回复</div>');
            return { displayHtml, feedbacks, hasWaiting, hasTaskDown };
        }
        
        async function streamDeepSeek(messages, onChunk) { 
            if (!apiKey) throw new Error("请先设置 API Key"); 
            const resp = await fetch("https://api.deepseek.com/v1/chat/completions", {
                method:"POST",
                headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
                body:JSON.stringify({ model:selectedModel, messages, stream:true, temperature:0.7 })
            }); 
            if (!resp.ok) { let errText = await resp.text(); throw new Error(`API错误 ${resp.status}: ${errText.slice(0,100)}`); }
            const reader = resp.body.getReader(); 
            const decoder = new TextDecoder(); 
            let buffer="", fullText=""; 
            while(true){ 
                const {done,value}=await reader.read(); 
                if(done) break; 
                buffer+=decoder.decode(value,{stream:true}); 
                const lines=buffer.split("\n"); 
                buffer=lines.pop(); 
                for(let line of lines){ 
                    if(line.startsWith("data: ")){ 
                        const data=line.slice(6); 
                        if(data==="[DONE]") return fullText; 
                        try{ 
                            const parsed=JSON.parse(data); 
                            const delta=parsed.choices[0]?.delta?.content; 
                            if(delta){ fullText+=delta; if(onChunk) onChunk(delta); } 
                        } catch(e){} 
                    } 
                } 
            } 
            return fullText; 
        }

        function extractToolName(fullText) {
            if (/<file-create/.test(fullText)) return 'file-create';
            if (/<file-update/.test(fullText)) return 'file-update';
            if (/<file-delete/.test(fullText)) return 'file-delete';
            if (/<get-time/.test(fullText)) return 'get-time';
            if (/<calc/.test(fullText)) return 'calc';
            if (/<check-code/.test(fullText)) return 'check-code';
            if (/<html/.test(fullText)) return 'html';
            if (/<get-clipboard/.test(fullText)) return 'get-clipboard';
            if (/<set-clipboard/.test(fullText)) return 'set-clipboard';
            if (/<uuid-generate/.test(fullText)) return 'uuid-generate';
            if (/<base64-encode/.test(fullText)) return 'base64-encode';
            if (/<base64-decode/.test(fullText)) return 'base64-decode';
            if (/<fetch-url/.test(fullText)) return 'fetch-url';
            if (/<detect-device/.test(fullText)) return 'detect-device';
            if (/<show-notification/.test(fullText)) return 'show-notification';
            if (/<qr-code/.test(fullText)) return 'qr-code';
            if (/<text-statistics/.test(fullText)) return 'text-statistics';
            if (/<json-validator/.test(fullText)) return 'json-validator';
            if (/<task-down|<task-done/.test(fullText)) return 'task-down';
            if (/<waiting|<wait-user/.test(fullText)) return 'waiting';
            return 'unknown';
        }
        
        async function runAgent(initialMsg) {
            if (agentActive) { addFeedbackMsg("已有任务运行中"); return; }
            agentActive = true; statusSpan.innerText = "🔵 运行中"; addUserMsg(initialMsg);
            conversationHistory = [{ role:"system", content: SYSTEM_PROMPT_FULL }, { role:"user", content: initialMsg }];
            let step=0, MAX_STEPS=20;
            while(agentActive && step<MAX_STEPS){
                step++; statusSpan.innerText=`🔵 思考中 (${step})`;
                let currentReply="", agentMsgDiv=addAgentMsgWithStream();
                let fullReply = "";
                const startTime = Date.now();
                try { fullReply = await streamDeepSeek(conversationHistory, (chunk)=>{ currentReply+=chunk; agentMsgDiv.innerHTML+=chunk; messagesDiv.scrollTop=messagesDiv.scrollHeight; }); } 
                catch(err) { addFeedbackMsg(`❌ API调用失败: ${err.message}`); addConsoleLog(`API错误: ${err.message}`, "error"); break; }
                if(!agentActive) break;
                const duration = Date.now() - startTime;
                const { displayHtml, feedbacks, hasTaskDown, hasWaiting } = await parseAndExecuteTags(fullReply);
                agentMsgDiv.innerHTML = displayHtml;
                conversationHistory.push({ role:"assistant", content: fullReply });
                if(feedbacks.length) conversationHistory.push({ role:"system", content: "系统反馈:\n"+feedbacks.join("\n") });
                let toolName = extractToolName(fullReply);
                let resultSummary = "";
                if (feedbacks.length > 0) {
                    resultSummary = feedbacks[0];
                } else if (hasTaskDown) {
                    resultSummary = "任务完成";
                } else if (hasWaiting) {
                    resultSummary = "等待用户回复";
                } else {
                    resultSummary = "无操作";
                }
                addConsoleLog(`🔧 工具: ${toolName} → ${resultSummary} (耗时 ${duration}ms)`, "info");
                if(hasTaskDown){ addFeedbackMsg("🏁 任务完成"); break; }
                if(hasWaiting){
                    statusSpan.innerText="⏸️ 等待回复";
                    await new Promise(resolve=>{ waitingResolver = resolve; });
                    if(window._pendingReply){ conversationHistory.push({ role:"user", content: window._pendingReply }); addUserMsg(window._pendingReply); window._pendingReply = null; }
                    statusSpan.innerText="🔵 继续执行";
                }
            }
            if(step>=MAX_STEPS && agentActive) addConsoleLog("达到最大执行步骤，任务自动停止", "warn");
            agentActive = false; statusSpan.innerText = "⚪ 空闲";
        }
        
        async function exportToPdf() {
            const messagesContainer = document.getElementById("messages");
            if (!messagesContainer || messagesContainer.children.length === 0) {
                addFeedbackMsg("没有对话内容可导出");
                return;
            }
            addFeedbackMsg("正在生成PDF，请稍候...");
            const originalOverflow = document.body.style.overflow;
            document.body.style.overflow = "auto";
            const cloneContainer = document.createElement("div");
            cloneContainer.style.position = "absolute";
            cloneContainer.style.left = "-9999px";
            cloneContainer.style.top = "0";
            cloneContainer.style.width = "800px";
            cloneContainer.style.background = "white";
            cloneContainer.style.padding = "30px";
            cloneContainer.style.fontFamily = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
            const headerDiv = document.createElement("div");
            headerDiv.style.textAlign = "center";
            headerDiv.style.marginBottom = "30px";
            headerDiv.style.borderBottom = "2px solid #a5d296";
            headerDiv.style.paddingBottom = "15px";
            headerDiv.innerHTML = `
                <h1 style="color:#1F2937; font-size:24px;">💚 MuYanCoding 对话记录</h1>
                <p style="color:#4B5563; margin-top:8px;">导出时间：${new Date().toLocaleString()}</p>
            `;
            cloneContainer.appendChild(headerDiv);
            const messagesClone = messagesContainer.cloneNode(true);
            messagesClone.style.display = "flex";
            messagesClone.style.flexDirection = "column";
            messagesClone.style.gap = "16px";
            for (let img of messagesClone.querySelectorAll('img')) {
                try {
                    const canvas = await html2canvas(img);
                    img.src = canvas.toDataURL();
                } catch(e) {}
            }
            cloneContainer.appendChild(messagesClone);
            document.body.appendChild(cloneContainer);
            try {
                const canvas = await html2canvas(cloneContainer, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    logging: false,
                    useCORS: true
                });
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const imgWidth = 210;
                const pageHeight = 297;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                let pdf = new jsPDF('p', 'mm', 'a4');
                let position = 0;
                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                let heightLeft = imgHeight - pageHeight;
                while (heightLeft > 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                }
                pdf.save(`muyancoding_conversation_${Date.now()}.pdf`);
                addFeedbackMsg("PDF已下载");
                addConsoleLog("对话已成功导出为PDF", "success");
            } catch(err) {
                console.error(err);
                addFeedbackMsg(`导出失败: ${err.message}`);
                addConsoleLog(`PDF导出错误: ${err.message}`, "error");
            } finally {
                document.body.removeChild(cloneContainer);
                document.body.style.overflow = originalOverflow;
            }
        }

            bindEvents();
            addFeedbackMsg("欢迎使用MuYanCoding｜专业的编程Agent");
            addConsoleLog("MuYanCoding 已启动，控制台就绪，已加载10个新工具，支持导出PDF下载", "success");
            setInterval(() => {
                if (statusSpan.innerText.includes("等待回复") && !document.getElementById("waitBox")) {
                    let div = document.createElement("div"); div.id = "waitBox"; div.style.cssText = "position:sticky; bottom:10px; background:white; border:1px solid #E5E7EB; border-radius:40px; padding:6px 12px; display:flex; gap:10px; margin:8px 0;";
                    div.innerHTML = `<input id="waitInput" placeholder="回复..." style="flex:1; border:none; outline:none;"><button id="waitSend" class="primary">发送</button>`;
                    messagesDiv.appendChild(div);
                    document.getElementById("waitSend").onclick = () => { let val = document.getElementById("waitInput").value.trim(); if (val && waitingResolver) { window._pendingReply = val; waitingResolver(); div.remove(); } };
                } else if (!statusSpan.innerText.includes("等待回复") && document.getElementById("waitBox")) document.getElementById("waitBox")?.remove();
            }, 200);
        }
        
        init();
    })();
</script>
</body>
</html>
