<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MuYanAgent</title>
    <link rel="icon" type="image/jpeg" href="https://gpo.saobby.com/i/BA9EN3Rw3fzRUJmu.jpg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-app: #0f0f12;
            --bg-sidebar: #141416;
            --bg-editor: #1a1a1f;
            --bg-chat: #1e1e24;
            --bg-terminal: #0c0c0e;
            --border: #2a2a2e;
            --border-light: #35353a;
            --text-primary: #ededee;
            --text-secondary: #a1a1aa;
            --text-tertiary: #71717a;
            --accent: #a5d296;
            --accent-dark: #8bb87a;
            --accent-strong: #5ca05c;
            --accent-soft: rgba(165, 210, 150, 0.12);
            --danger: #f87171;
            --success: #34d399;
            --warning: #fbbf24;
            --code-bg: #0f0f14;
            --code-border: #2d2d35;
            --chat-user-bg: #2d2d35;
            --chat-assistant-bg: #25252c;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 8px rgba(0,0,0,0.4);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
        }
        body {
            font-family: var(--font-sans);
            background: var(--bg-app);
            height: 100vh;
            overflow: hidden;
            color: var(--text-primary);
        }
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .top-bar {
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
            gap: 16px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            font-size: 20px;
            color: var(--accent);
        }
        .logo-text {
            font-weight: 600;
            font-size: 15px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.2px;
        }
        .mode-switch {
            display: flex;
            background: #1a1a1f;
            border-radius: 32px;
            padding: 2px;
            border: 1px solid var(--border);
            margin-left: 8px;
        }
        .mode-option {
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 32px;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text-tertiary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mode-option.active {
            background: var(--accent);
            color: #0f0f12;
        }
        .api-panel {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            background: #25252c;
            border: 1px solid var(--border);
            padding: 5px 12px;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 12px;
            font-family: var(--font-sans);
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #0f0f12;
        }
        button.primary:hover {
            background: var(--accent-dark);
        }
        button.danger {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
            color: var(--danger);
        }
        button.danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        .status-badge {
            background: #1a1a1f;
            padding: 4px 8px;
            border-radius: 32px;
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .token-display {
            background: #1a1a1f;
            padding: 4px 8px;
            border-radius: 32px;
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--accent);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .workspace-area {
            display: flex;
            flex: 1;
            transition: all 0.2s;
            overflow: hidden;
        }
        .workspace-area.hidden {
            width: 0;
            flex: 0;
            opacity: 0;
            pointer-events: none;
        }
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .file-header {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 500;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-tertiary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-header-actions {
            display: flex;
            gap: 6px;
        }
        .file-header-actions button {
            padding: 2px 8px;
            font-size: 11px;
            background: transparent;
            border: 1px solid var(--border-light);
        }
        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .tree-node {
            list-style: none;
            margin-left: 0;
            padding-left: 0;
        }
        .tree-node-children {
            padding-left: 18px;
            list-style: none;
        }
        .tree-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.1s;
            user-select: none;
        }
        .tree-item-content {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            overflow: hidden;
        }
        .tree-item-content span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tree-item:hover {
            background: #2a2a2e;
        }
        .tree-item.active {
            background: var(--accent-soft);
            color: var(--accent);
        }
        .folder-toggle {
            width: 16px;
            text-align: center;
            cursor: pointer;
            color: var(--text-tertiary);
            font-size: 10px;
        }
        .item-icon {
            font-size: 14px;
            width: 20px;
            color: var(--text-secondary);
        }
        .item-actions {
            display: none;
            gap: 4px;
        }
        .tree-item:hover .item-actions {
            display: flex;
        }
        .item-actions button {
            background: transparent;
            border: none;
            padding: 2px 4px;
            font-size: 10px;
            color: var(--text-tertiary);
        }
        .item-actions button:hover {
            color: var(--accent);
        }
        .center-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-editor);
            min-width: 0;
        }
        .editor-toolbar {
            padding: 6px 12px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        #editor {
            flex: 1;
            background: var(--bg-editor);
            border: none;
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.5;
            resize: none;
            outline: none;
            color: var(--text-primary);
        }
        .right-panel {
            width: 380px;
            background: var(--bg-chat);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: flex 0.2s;
        }
        .main-layout:has(.workspace-area.hidden) .right-panel {
            flex: 1;
            width: auto;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            border-radius: 16px;
            padding: 8px 12px;
            max-width: 92%;
            font-size: 13px;
            line-height: 1.45;
            animation: fadeIn 0.2s ease;
        }
        .user-msg {
            background: var(--chat-user-bg);
            color: var(--text-primary);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .agent-msg {
            background: var(--chat-assistant-bg);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-left: 2px solid var(--accent);
        }
        .feedback-msg {
            background: #23232a;
            color: var(--text-tertiary);
            font-size: 11px;
            font-family: var(--font-mono);
            align-self: flex-start;
            border-left: 2px solid var(--success);
            max-width: 100%;
        }
        .thinking {
            background: #23232a;
            padding: 4px 8px;
            border-radius: var(--radius-md);
            font-size: 11px;
            font-style: italic;
            border-left: 2px solid var(--warning);
            margin: 4px 0;
        }
        pre {
            background: var(--code-bg);
            border: 1px solid var(--code-border);
            border-radius: var(--radius-md);
            padding: 8px;
            overflow-x: auto;
            font-size: 11px;
            font-family: var(--font-mono);
            margin: 6px 0;
            color: var(--text-secondary);
        }
        .task-done {
            background: var(--success);
            color: #0f0f12;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 500;
        }
        .waiting-pill {
            background: var(--warning);
            color: #0f0f12;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
        }
        .input-area {
            padding: 12px;
            background: var(--bg-chat);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }
        textarea {
            flex: 1;
            background: #25252c;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 8px 14px;
            font-family: var(--font-sans);
            font-size: 13px;
            resize: none;
            outline: none;
            color: var(--text-primary);
        }
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft);
        }
        .terminal-panel {
            background: var(--bg-terminal);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: height 0.2s ease;
            height: 180px;
        }
        .terminal-panel.collapsed {
            height: 34px;
        }
        .terminal-panel.collapsed .console-log {
            display: none;
        }
        .terminal-header {
            padding: 4px 12px;
            background: #141416;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 11px;
            flex-shrink: 0;
        }
        .terminal-header span {
            cursor: pointer;
            color: var(--text-tertiary);
        }
        .terminal-header span.active {
            color: var(--accent);
        }
        .terminal-header button {
            background: #25252c;
            padding: 2px 8px;
            font-size: 10px;
            margin-left: auto;
        }
        .console-log {
            flex: 1;
            overflow-y: auto;
            padding: 6px 12px;
            font-family: var(--font-mono);
            font-size: 10px;
            line-height: 1.4;
        }
        .log-entry {
            margin: 2px 0;
            border-left: 2px solid transparent;
            padding-left: 6px;
        }
        .log-info { border-left-color: var(--accent); color: #a1a1aa; }
        .log-error { border-left-color: var(--danger); color: #fca5a5; }
        .log-warn { border-left-color: var(--warning); }
        .log-success { border-left-color: var(--success); }
        .log-time {
            color: var(--text-tertiary);
            margin-right: 8px;
        }
        .collapse-btn {
            background: transparent;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            font-size: 12px;
            padding: 0 6px;
            margin-left: 8px;
        }
        .collapse-btn:hover {
            color: var(--accent);
        }
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 500px;
            max-height: 85%;
            background: var(--bg-sidebar);
            border-radius: var(--radius-xl);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--accent);
        }
        .modal-header {
            padding: 12px 20px;
            background: #141416;
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border);
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .settings-section {
            background: #1a1a1f;
            border-radius: var(--radius-lg);
            padding: 16px;
            border: 1px solid var(--border);
        }
        .settings-section-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent);
        }
        .input-group {
            margin-bottom: 14px;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .input-group input, .input-group select {
            width: 100%;
            background: #0f0f12;
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: var(--radius-md);
            font-size: 12px;
            color: var(--text-primary);
            outline: none;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent);
        }
        .info-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .info-link {
            color: var(--accent);
            text-decoration: none;
        }
        .info-link:hover {
            text-decoration: underline;
        }
        .download-btn {
            background: var(--accent-soft);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: var(--radius-md);
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
            color: var(--accent);
        }
        .download-btn:hover {
            background: var(--accent);
            color: #0f0f12;
        }
        .modal-footer {
            padding: 12px 20px;
            background: #141416;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            border-radius: 0 0 var(--radius-xl) var(--radius-xl);
        }
        .hidden {
            display: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .agent-msg h1, .agent-msg h2, .agent-msg h3 { font-family: var(--font-sans); font-weight: 500; margin: 0.5rem 0; }
        .agent-msg ul, .agent-msg ol { margin: 0.3rem 0 0.3rem 1.2rem; }
        .agent-msg blockquote { border-left: 2px solid var(--accent); padding-left: 0.8rem; margin: 0.4rem 0; color: var(--text-secondary); }
        .agent-msg code { background: var(--code-bg); padding: 2px 4px; border-radius: 4px; font-family: var(--font-mono); }
        .preview-btn {
            background: var(--accent-soft);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            color: var(--accent);
            cursor: pointer;
        }
        .preview-btn:hover {
            background: var(--accent);
            color: #0f0f12;
        }
        .qr-img {
            max-width: 100px;
            border-radius: var(--radius-md);
            margin: 4px 0;
            background: white;
            padding: 4px;
        }
        #waitBox {
            position: sticky;
            bottom: 8px;
            background: #2a2a2e;
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 6px 12px;
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-sidebar);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 3px;
        }
        i.icon-fw {
            width: 1.25em;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <div class="logo-area">
            <i class="fas fa-infinity logo-icon"></i>
            <span class="logo-text">MuYanCoding</span>
            <div class="mode-switch" id="modeSwitch">
                <span class="mode-option active" data-mode="coding"><i class="fas fa-code"></i><span>CodingAgent</span></span>
                <span class="mode-option" data-mode="agent"><i class="fas fa-comments"></i><span>Agent</span></span>
            </div>
        </div>
        <div class="api-panel">
            <button id="settingsBtn"><i class="fas fa-sliders-h"></i> 设置</button>
            <button id="stopBtn" class="danger"><i class="fas fa-stop"></i> 停止</button>
            <button id="clearMemoryBtn"><i class="fas fa-trash-alt"></i> 清除</button>
            <div class="token-display" id="tokenDisplay"><i class="fas fa-chart-simple"></i> 0 tok</div>
            <div class="status-badge" id="status"><i class="fas fa-circle"></i> 空闲</div>
        </div>
    </div>
    <div class="main-layout">
        <div class="workspace-area" id="workspaceArea">
            <div class="sidebar">
                <div class="file-header">
                    <span><i class="fas fa-folder-open"></i> 资源管理器</span>
                    <div class="file-header-actions">
                        <button id="newFileBtn" title="新建文件"><i class="fas fa-file"></i></button>
                        <button id="newFolderBtn" title="新建文件夹"><i class="fas fa-folder"></i></button>
                    </div>
                </div>
                <div class="file-tree" id="fileTree"></div>
            </div>
            <div class="center-area">
                <div class="editor-toolbar">
                    <span id="curFile"><i class="fas fa-file-code"></i> 未选择文件</span>
                    <div style="display: flex; gap: 6px;">
                        <button id="saveFileBtn"><i class="fas fa-save"></i> 保存</button>
                        <button id="downloadBtn"><i class="fas fa-download"></i> 下载</button>
                        <button id="manualPreviewBtn" class="preview-btn hidden"><i class="fas fa-globe"></i> 预览</button>
                    </div>
                </div>
                <textarea id="editor" placeholder="编辑代码... MuYanCoding 将自动处理文件操作"></textarea>
            </div>
        </div>
        <div class="right-panel">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <textarea id="prompt" rows="1" placeholder="描述任务..."></textarea>
                <button id="sendBtn" class="primary"><i class="fas fa-paper-plane"></i> 发送</button>
            </div>
        </div>
    </div>
    <div class="terminal-panel" id="terminalPanel">
        <div class="terminal-header">
            <span id="consoleTabLog" class="active"><i class="fas fa-terminal"></i> 执行日志</span>
            <button id="exportPdfBtn"><i class="fas fa-file-pdf"></i> 导出 PDF</button>
            <span id="consoleTabClear"><i class="fas fa-eraser"></i> 清空</span>
            <button id="collapseTerminalBtn" class="collapse-btn" title="折叠/展开"><i class="fas fa-chevron-down"></i></button>
        </div>
        <div class="console-log" id="consoleLog"></div>
    </div>
</div>
<div id="previewModal" class="modal hidden">
    <div class="modal-header"><span><i class="fas fa-globe"></i> 实时预览</span><button id="closePreview"><i class="fas fa-times"></i></button></div>
    <iframe id="previewFrame"></iframe>
</div>
<div id="settingsModal" class="modal hidden">
    <div class="modal-header"><span><i class="fas fa-cog"></i> 设置</span><button id="closeSettingsBtn"><i class="fas fa-times"></i></button></div>
    <div class="modal-body">
        <div class="settings-section">
            <div class="settings-section-title"><i class="fas fa-key"></i> API 配置</div>
            <div class="input-group">
                <label>DeepSeek API Key</label>
                <input type="text" id="settingsApiKey" placeholder="sk-...">
            </div>
            <div class="input-group">
                <label>模型选择</label>
                <select id="settingsModelSelect">
                    <option value="deepseek-chat">deepseek-chat</option>
                    <option value="deepseek-coder">deepseek-coder</option>
                    <option value="deepseek-v4-flash">deepseek-v4-flash</option>
                    <option value="deepseek-v4-pro">deepseek-v4-pro</option>
                </select>
            </div>
            <button id="saveSettingsBtn" class="primary" style="width:100%;"><i class="fas fa-save"></i> 保存设置</button>
        </div>
        <div class="settings-section">
            <div class="settings-section-title"><i class="fas fa-info-circle"></i> 关于</div>
            <div class="info-text"><i class="fas fa-user-astronaut"></i> 开发者：CCWMORAN 慕然科技 @Morgan</div>
            <div class="info-text"><i class="fas fa-link"></i> 慕然科技官网：<a href="https://www.ccwmoran.top" target="_blank" class="info-link">www.ccwmoran.top</a></div>
            <div class="info-text"><i class="fas fa-mobile-alt"></i> 下载移动端 App：</div>
            <button id="appDownloadBtn" class="download-btn"><i class="fas fa-download"></i> 即将上线</button>
        </div>
    </div>
    <div class="modal-footer"><button id="closeSettingsFooterBtn">关闭</button></div>
</div>

<script>
    (function() {
        let virtualFs = {}; 
        let currentFilePath = null;
        let apiKey = localStorage.getItem("muyan_api") || "";
        let selectedModel = "deepseek-chat";
        let agentActive = false;
        let waitingResolver = null;
        let conversationHistory = [];
        let totalTokensUsed = 0;
        let expandedFolders = new Set(); 
        let currentMode = "coding"; 

        function normalizePath(path) { return path.replace(/\\/g, '/').replace(/\/+/g, '/').replace(/^\/+/, ''); }
        function getDirPath(filePath) { let lastSlash = filePath.lastIndexOf('/'); return lastSlash === -1 ? '' : filePath.substring(0, lastSlash); }
        function getBaseName(filePath) { let parts = filePath.split('/'); return parts[parts.length-1]; }
        function ensureDirExists(dirPath) {
            if (!dirPath) return true;
            const parts = dirPath.split('/');
            let current = '';
            for (let part of parts) {
                if (!part) continue;
                current = current ? current + '/' + part : part;
                if (!virtualFs[current]) virtualFs[current] = { type: 'folder', children: {}, content: null };
                else if (virtualFs[current].type !== 'folder') return false;
            }
            return true;
        }
        function initDefaultFs() {
            if (Object.keys(virtualFs).length === 0) {
                virtualFs['welcome.txt'] = { type: 'file', content: '欢迎使用 MuYanCoding！\n\n你可以新建文件/文件夹，或者让 AI 助手帮你编写代码。', mtime: Date.now() };
                virtualFs['src'] = { type: 'folder', children: {} };
                virtualFs['src/main.js'] = { type: 'file', content: 'console.log("Hello MuYanCoding!");', mtime: Date.now() };
                virtualFs['src/style.css'] = { type: 'file', content: 'body { margin: 0; background: #0f0f12; }', mtime: Date.now() };
                expandedFolders.add('src');
            }
        }
        function buildTree() {
            const tree = { children: {}, type: 'folder' };
            for (let path in virtualFs) {
                if (path === '') continue;
                const parts = path.split('/');
                let current = tree;
                for (let i = 0; i < parts.length; i++) {
                    const part = parts[i];
                    const isLast = i === parts.length-1;
                    if (!current.children[part]) {
                        current.children[part] = { name: part, children: {}, type: isLast ? virtualFs[path].type : 'folder', fullPath: parts.slice(0,i+1).join('/'), isVirtual: true, expanded: false };
                    }
                    if (!isLast) current = current.children[part];
                    else { current.children[part].itemData = virtualFs[path]; current.children[part].fullPath = path; }
                }
            }
            function setExpandedFlag(node) { for (let key in node.children) { const child = node.children[key]; if (child.type === 'folder') { if (expandedFolders.has(child.fullPath)) child.expanded = true; else child.expanded = false; setExpandedFlag(child); } } }
            setExpandedFlag(tree);
            return tree;
        }
        function renderTree(node, container) {
            const sorted = Object.keys(node.children).sort((a,b) => {
                const aIsFolder = node.children[a].type === 'folder';
                const bIsFolder = node.children[b].type === 'folder';
                if (aIsFolder !== bIsFolder) return aIsFolder ? -1 : 1;
                return a.localeCompare(b);
            });
            for (let name of sorted) {
                const child = node.children[name];
                const li = document.createElement('li'); li.className = 'tree-node';
                const div = document.createElement('div'); div.className = 'tree-item' + (currentFilePath === child.fullPath && child.type === 'file' ? ' active' : '');
                const contentDiv = document.createElement('div'); contentDiv.className = 'tree-item-content';
                if (child.type === 'folder') {
                    const toggleSpan = document.createElement('span'); toggleSpan.className = 'folder-toggle';
                    toggleSpan.innerHTML = child.expanded ? '<i class="fas fa-chevron-down"></i>' : '<i class="fas fa-chevron-right"></i>';
                    toggleSpan.onclick = (e) => { e.stopPropagation(); if (child.expanded) expandedFolders.delete(child.fullPath); else expandedFolders.add(child.fullPath); renderFullTree(); };
                    contentDiv.appendChild(toggleSpan);
                    const iconSpan = document.createElement('span'); iconSpan.className = 'item-icon';
                    iconSpan.innerHTML = child.expanded ? '<i class="fas fa-folder-open"></i>' : '<i class="fas fa-folder"></i>';
                    contentDiv.appendChild(iconSpan);
                } else {
                    const toggleSpan = document.createElement('span'); toggleSpan.className = 'folder-toggle'; toggleSpan.innerHTML = '&nbsp;&nbsp;';
                    contentDiv.appendChild(toggleSpan);
                    const iconSpan = document.createElement('span'); iconSpan.className = 'item-icon';
                    iconSpan.innerHTML = '<i class="fas fa-file-alt"></i>';
                    contentDiv.appendChild(iconSpan);
                }
                const nameSpan = document.createElement('span'); nameSpan.textContent = name;
                contentDiv.appendChild(nameSpan);
                div.appendChild(contentDiv);
                const actions = document.createElement('div'); actions.className = 'item-actions';
                if (child.type === 'file') {
                    const renameBtn = document.createElement('button'); renameBtn.innerHTML = '<i class="fas fa-edit"></i>'; renameBtn.title = '重命名'; renameBtn.onclick = (e) => { e.stopPropagation(); renameNode(child.fullPath, child.type); }; actions.appendChild(renameBtn);
                    const delBtn = document.createElement('button'); delBtn.innerHTML = '<i class="fas fa-trash"></i>'; delBtn.title = '删除'; delBtn.onclick = (e) => { e.stopPropagation(); deleteNode(child.fullPath); }; actions.appendChild(delBtn);
                } else {
                    const newFileBtn = document.createElement('button'); newFileBtn.innerHTML = '<i class="fas fa-file"></i>'; newFileBtn.title = '新建文件'; newFileBtn.onclick = (e) => { e.stopPropagation(); createFileInFolder(child.fullPath); }; actions.appendChild(newFileBtn);
                    const newFolderBtn = document.createElement('button'); newFolderBtn.innerHTML = '<i class="fas fa-folder"></i>'; newFolderBtn.title = '新建文件夹'; newFolderBtn.onclick = (e) => { e.stopPropagation(); createFolderInFolder(child.fullPath); }; actions.appendChild(newFolderBtn);
                    const renameBtn = document.createElement('button'); renameBtn.innerHTML = '<i class="fas fa-edit"></i>'; renameBtn.onclick = (e) => { e.stopPropagation(); renameNode(child.fullPath, child.type); }; actions.appendChild(renameBtn);
                    const delBtn = document.createElement('button'); delBtn.innerHTML = '<i class="fas fa-trash"></i>'; delBtn.onclick = (e) => { e.stopPropagation(); deleteNode(child.fullPath); }; actions.appendChild(delBtn);
                }
                div.appendChild(actions);
                div.onclick = (e) => { if (e.target.closest('.item-actions')) return; if (child.type === 'file') openFile(child.fullPath); };
                li.appendChild(div);
                if (child.type === 'folder' && child.expanded && child.children) { const childUl = document.createElement('ul'); childUl.className = 'tree-node-children'; renderTree(child, childUl); li.appendChild(childUl); }
                container.appendChild(li);
            }
        }
        function renderFullTree() { const container = document.getElementById('fileTree'); if (!container) return; container.innerHTML = ''; const root = buildTree(); const rootUl = document.createElement('ul'); rootUl.className = 'tree-node'; renderTree(root, rootUl); container.appendChild(rootUl); }
        function openFile(path) { if (virtualFs[path] && virtualFs[path].type === 'file') { currentFilePath = path; document.getElementById('editor').value = virtualFs[path].content || ''; document.getElementById('curFile').innerHTML = '<i class="fas fa-file-code"></i> ' + path; renderFullTree(); const previewBtn = document.getElementById('manualPreviewBtn'); if (path.endsWith('.html') || path.endsWith('.htm')) previewBtn.classList.remove('hidden'); else previewBtn.classList.add('hidden'); } }
        function saveCurrentFile() { if (!currentFilePath) { addFeedbackMsg('请先选择文件'); return; } const content = document.getElementById('editor').value; if (virtualFs[currentFilePath]) { virtualFs[currentFilePath].content = content; virtualFs[currentFilePath].mtime = Date.now(); addFeedbackMsg(`💾 已保存 ${currentFilePath}`); renderFullTree(); } else addFeedbackMsg('文件不存在'); }
        function createFile(path, content = '') { const normalized = normalizePath(path); if (virtualFs[normalized]) return false; const dir = getDirPath(normalized); if (dir && !virtualFs[dir]) ensureDirExists(dir); virtualFs[normalized] = { type: 'file', content: content, mtime: Date.now() }; renderFullTree(); openFile(normalized); addFeedbackMsg(`📄 创建文件: ${normalized}`); return true; }
        function createFolder(path) { const normalized = normalizePath(path); if (virtualFs[normalized]) return false; const dir = getDirPath(normalized); if (dir && !virtualFs[dir]) ensureDirExists(dir); virtualFs[normalized] = { type: 'folder', children: {}, mtime: Date.now() }; renderFullTree(); addFeedbackMsg(`📁 创建文件夹: ${normalized}`); return true; }
        function createFileInFolder(folderPath) { let name = prompt('文件名:', '新文件.txt'); if (!name) return; if (name.includes('/') || name.includes('\\')) { alert('文件名不能包含路径分隔符'); return; } const newPath = folderPath ? folderPath + '/' + name : name; createFile(newPath, ''); }
        function createFolderInFolder(folderPath) { let name = prompt('文件夹名:', '新文件夹'); if (!name) return; if (name.includes('/') || name.includes('\\')) { alert('文件夹名不能包含路径分隔符'); return; } const newPath = folderPath ? folderPath + '/' + name : name; createFolder(newPath); }
        function renameNode(oldPath, type) { let newBase = prompt(`重命名 ${getBaseName(oldPath)}`, getBaseName(oldPath)); if (!newBase || newBase === getBaseName(oldPath)) return; if (newBase.includes('/') || newBase.includes('\\')) { alert('名称不能包含路径分隔符'); return; } const dir = getDirPath(oldPath); const newPath = dir ? dir + '/' + newBase : newBase; if (virtualFs[newPath]) { alert('目标已存在'); return; } if (type === 'file') { virtualFs[newPath] = { ...virtualFs[oldPath], type: 'file' }; delete virtualFs[oldPath]; if (currentFilePath === oldPath) { currentFilePath = newPath; document.getElementById('editor').value = virtualFs[newPath].content || ''; document.getElementById('curFile').innerHTML = '<i class="fas fa-file-code"></i> ' + newPath; } } else { const childrenToMove = Object.keys(virtualFs).filter(p => p.startsWith(oldPath + '/') || p === oldPath); for (let child of childrenToMove) { const relative = child.substring(oldPath.length); const newChildPath = newPath + relative; virtualFs[newChildPath] = virtualFs[child]; delete virtualFs[child]; } virtualFs[newPath] = { type: 'folder', mtime: Date.now() }; if (currentFilePath && currentFilePath.startsWith(oldPath)) { currentFilePath = newPath + currentFilePath.substring(oldPath.length); if (virtualFs[currentFilePath]?.type === 'file') document.getElementById('editor').value = virtualFs[currentFilePath].content || ''; document.getElementById('curFile').innerHTML = '<i class="fas fa-file-code"></i> ' + currentFilePath; } if (expandedFolders.has(oldPath)) { expandedFolders.delete(oldPath); expandedFolders.add(newPath); } delete virtualFs[oldPath]; } renderFullTree(); addFeedbackMsg(`✏️ 已重命名: ${oldPath} → ${newPath}`); }
        function deleteNode(path) { if (!confirm(`确定删除 ${path} 吗？`)) return; const toDelete = Object.keys(virtualFs).filter(p => p === path || p.startsWith(path + '/')); for (let p of toDelete) { if (expandedFolders.has(p)) expandedFolders.delete(p); delete virtualFs[p]; } if (currentFilePath && (currentFilePath === path || currentFilePath.startsWith(path + '/'))) { currentFilePath = null; document.getElementById('editor').value = ''; document.getElementById('curFile').innerHTML = '<i class="fas fa-file-code"></i> 未选择文件'; document.getElementById('manualPreviewBtn').classList.add('hidden'); } renderFullTree(); addFeedbackMsg(`🗑️ 已删除: ${path}`); }
        function moveNode(sourcePath, targetPath) { const srcNorm = normalizePath(sourcePath); const tgtNorm = normalizePath(targetPath); if (!virtualFs[srcNorm]) return `❌ 源路径不存在: ${srcNorm}`; if (virtualFs[tgtNorm]) return `❌ 目标路径已存在: ${tgtNorm}`; if (srcNorm === tgtNorm) return `❌ 路径相同`; if (tgtNorm.startsWith(srcNorm + '/')) return `❌ 不能移动到自身内部`; const targetDir = getDirPath(tgtNorm); if (targetDir && !virtualFs[targetDir]) ensureDirExists(targetDir); const type = virtualFs[srcNorm].type; if (type === 'file') { virtualFs[tgtNorm] = { ...virtualFs[srcNorm], type: 'file' }; delete virtualFs[srcNorm]; if (currentFilePath === srcNorm) { currentFilePath = tgtNorm; document.getElementById('editor').value = virtualFs[tgtNorm].content || ''; document.getElementById('curFile').innerHTML = '<i class="fas fa-file-code"></i> ' + tgtNorm; } } else { const childrenToMove = Object.keys(virtualFs).filter(p => p === srcNorm || p.startsWith(srcNorm + '/')); for (let child of childrenToMove) { const relative = child.substring(srcNorm.length); const newChildPath = tgtNorm + relative; virtualFs[newChildPath] = virtualFs[child]; delete virtualFs[child]; } if (expandedFolders.has(srcNorm)) { expandedFolders.delete(srcNorm); expandedFolders.add(tgtNorm); } if (currentFilePath && currentFilePath.startsWith(srcNorm)) { currentFilePath = tgtNorm + currentFilePath.substring(srcNorm.length); if (virtualFs[currentFilePath]?.type === 'file') document.getElementById('editor').value = virtualFs[currentFilePath].content || ''; document.getElementById('curFile').innerHTML = '<i class="fas fa-file-code"></i> ' + currentFilePath; } } renderFullTree(); return `✅ 已移动: ${srcNorm} → ${tgtNorm}`; }
        function readFileContent(path) { const norm = normalizePath(path); if (!virtualFs[norm]) return `❌ 文件不存在: ${norm}`; if (virtualFs[norm].type !== 'file') return `❌ 不是文件`; const content = virtualFs[norm].content || ''; const preview = content.length > 2000 ? content.substring(0,2000)+'\n...(截断)' : content; return `✅ 文件 ${norm} 内容:\n${preview}`; }
        function searchFilesByKeyword(keyword) { if (!keyword.trim()) return `❌ 关键词无效`; const kw = keyword.toLowerCase(); const matches = []; for (let path in virtualFs) if (virtualFs[path].type === 'file' && path.toLowerCase().includes(kw)) matches.push(path); if (matches.length === 0) return `🔍 未找到包含 "${keyword}" 的文件`; return `🔍 找到 ${matches.length} 个匹配文件:\n${matches.join('\n')}`; }
        function downloadCurrentFile() { if (!currentFilePath) { addFeedbackMsg('无可下载文件'); return; } const content = virtualFs[currentFilePath]?.content || ''; const blob = new Blob([content]); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = getBaseName(currentFilePath); a.click(); URL.revokeObjectURL(a.href); }
        function clearContextMemory() { conversationHistory = []; document.getElementById('messages').innerHTML = ''; totalTokensUsed = 0; updateTokenDisplay(); addFeedbackMsg('🧹 上下文记忆已清除'); addConsoleLog('🧹 Agent 上下文记忆已清除，对话历史已清空', 'info'); }
        function updateTokenDisplay() { document.getElementById('tokenDisplay').innerHTML = '<i class="fas fa-chart-simple"></i> ' + totalTokensUsed + ' tok'; }
        function estimateTokens(text) { if (!text) return 0; let chinese = (text.match(/[\u4e00-\u9fa5]/g) || []).length; let other = text.length - chinese; return Math.ceil(other / 3.5 + chinese / 1.5); }

        const settingsModal = document.getElementById('settingsModal');
        const settingsApiKey = document.getElementById('settingsApiKey');
        const settingsModelSelect = document.getElementById('settingsModelSelect');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const closeSettingsFooterBtn = document.getElementById('closeSettingsFooterBtn');
        const appDownloadBtn = document.getElementById('appDownloadBtn');
        function openSettingsModal() { settingsModal.classList.remove('hidden'); }
        function closeSettingsModal() { settingsModal.classList.add('hidden'); }
        settingsBtn.onclick = openSettingsModal;
        closeSettingsBtn.onclick = closeSettingsModal;
        closeSettingsFooterBtn.onclick = closeSettingsModal;
        if (appDownloadBtn) appDownloadBtn.onclick = () => alert('移动端 App 即将上线，敬请期待！');
        function loadSettingsToModal() { settingsApiKey.value = apiKey; settingsModelSelect.value = selectedModel; }
        function saveSettings() { apiKey = settingsApiKey.value.trim(); selectedModel = settingsModelSelect.value; localStorage.setItem('muyan_api', apiKey); addFeedbackMsg('✅ API Key 和模型设置已保存'); addConsoleLog(`API设置已更新，模型: ${selectedModel}`, 'success'); closeSettingsModal(); }
        saveSettingsBtn.onclick = saveSettings;

        window.executeFileOperation = async function(operation, path, content = null, target = null) {
            if (currentMode !== 'coding') return `❌ 当前为 Agent 模式，无法使用文件/文件夹工具。请切换到 CodingAgent 模式使用资源管理器功能。`;
            const normPath = normalizePath(path);
            if (operation === "create") { if (virtualFs[normPath]) return `❌ 文件已存在`; createFile(normPath, content || ''); return `✅ 文件已创建: ${normPath}`; }
            if (operation === "update") { if (!virtualFs[normPath] || virtualFs[normPath].type !== 'file') return `❌ 文件不存在`; virtualFs[normPath].content = content; if (currentFilePath === normPath) document.getElementById('editor').value = content; renderFullTree(); return `✅ 已更新: ${normPath}`; }
            if (operation === "delete") { deleteNode(normPath); return `✅ 已删除: ${normPath}`; }
            if (operation === "create_folder") { if (virtualFs[normPath]) return `❌ 文件夹已存在`; createFolder(normPath); return `✅ 文件夹已创建: ${normPath}`; }
            if (operation === "rename") { const newPath = normalizePath(target); if (!virtualFs[normPath]) return `❌ 路径不存在`; if (virtualFs[newPath]) return `❌ 目标已存在`; renameNode(normPath, virtualFs[normPath].type); return `✅ 已重命名: ${normPath} → ${newPath}`; }
            if (operation === "move") { return moveNode(normPath, normalizePath(target)); }
            return "未知操作";
        };

        async function parseAndExecuteTags(fullText) {
            let displayHtml = fullText;
            let feedbacks = [];
            let executedTools = [];
            displayHtml = displayHtml.replace(/<thinking>([\s\S]*?)<\/thinking>/g, `<div class="thinking">💭 ${escapeHtml("$1")}</div>`);
            const toolPatterns = [
                { regex: /<file-create\s+path="([^"]+)"\s*>([\s\S]*?)<\/file-create>/g, name: 'file-create', handler: async (m) => await window.executeFileOperation("create", m[1], m[2]) },
                { regex: /<file-update\s+path="([^"]+)"\s*>([\s\S]*?)<\/file-update>/g, name: 'file-update', handler: async (m) => await window.executeFileOperation("update", m[1], m[2]) },
                { regex: /<file-delete\s+path="([^"]+)"\s*\/>/g, name: 'file-delete', handler: async (m) => await window.executeFileOperation("delete", m[1]) },
                { regex: /<folder-create\s+path="([^"]+)"\s*\/>/g, name: 'folder-create', handler: async (m) => await window.executeFileOperation("create_folder", m[1]) },
                { regex: /<rename\s+old-path="([^"]+)"\s+new-path="([^"]+)"\s*\/>/g, name: 'rename', handler: async (m) => await window.executeFileOperation("rename", m[1], null, m[2]) },
                { regex: /<move\s+source="([^"]+)"\s+target="([^"]+)"\s*\/>/g, name: 'move', handler: async (m) => await window.executeFileOperation("move", m[1], null, m[2]) },
                { regex: /<read-file\s+path="([^"]+)"\s*\/>/g, name: 'read-file', handler: async (m) => readFileContent(m[1]) },
                { regex: /<search-files\s+keyword="([^"]+)"\s*\/>/g, name: 'search-files', handler: async (m) => searchFilesByKeyword(m[1]) },
                { regex: /<get-time\s*\/>/g, name: 'get-time', handler: async () => { let now = new Date(); return `✅ 当前时间: ${now.toISOString().slice(0,19).replace('T',' ')}`; } },
                { regex: /<calc>([\s\S]*?)<\/calc>/g, name: 'calc', handler: async (m) => { try { let result = eval(m[1]); return `✅ 计算结果: ${m[1]} = ${result}`; } catch(e) { return `❌ 计算错误: ${e.message}`; } } },
                { regex: /<get-clipboard\s*\/>/g, name: 'get-clipboard', handler: async () => { try { const text = await navigator.clipboard.readText(); return `📋 剪贴板内容: ${text.substring(0,200)}`; } catch(e) { return `❌ 读取剪贴板失败: ${e.message}`; } } },
                { regex: /<set-clipboard>([\s\S]*?)<\/set-clipboard>/g, name: 'set-clipboard', handler: async (m) => { try { await navigator.clipboard.writeText(m[1]); return `✅ 已写入剪贴板`; } catch(e) { return `❌ 写入剪贴板失败: ${e.message}`; } } },
                { regex: /<uuid-generate\s*\/>/g, name: 'uuid-generate', handler: async () => { return `🔑 新UUID: ${crypto.randomUUID()}`; } },
                { regex: /<base64-encode>([\s\S]*?)<\/base64-encode>/g, name: 'base64-encode', handler: async (m) => { try { let encoded = btoa(unescape(encodeURIComponent(m[1]))); return `✅ Base64编码成功: ${encoded.substring(0,80)}...`; } catch(e) { return `❌ 编码失败: ${e.message}`; } } },
                { regex: /<base64-decode>([\s\S]*?)<\/base64-decode>/g, name: 'base64-decode', handler: async (m) => { try { let decoded = decodeURIComponent(escape(atob(m[1]))); return `✅ Base64解码成功: ${decoded.substring(0,100)}`; } catch(e) { return `❌ 解码失败: ${e.message}`; } } },
                { regex: /<fetch-url\s+url="([^"]+)"\s*\/>/g, name: 'fetch-url', handler: async (m) => { try { let controller = new AbortController(); let timeout = setTimeout(() => controller.abort(), 10000); let resp = await fetch(m[1], { signal: controller.signal }); clearTimeout(timeout); let text = await resp.text(); return `✅ 获取 ${m[1]} 成功 (${resp.status})，内容预览: ${text.substring(0,300)}`; } catch(e) { return `❌ 获取URL失败: ${e.message}`; } } },
                { regex: /<detect-device\s*\/>/g, name: 'detect-device', handler: async () => { return `🖥️ 设备信息: ${navigator.userAgent.substring(0,80)}`; } },
                { regex: /<show-notification\s+title="([^"]*)"\s+body="([^"]*)"\s*\/>/g, name: 'show-notification', handler: async (m) => { try { if (Notification.permission === "granted") new Notification(m[1]||"通知", {body:m[2]}); else if (Notification.permission !== "denied") await Notification.requestPermission(); return `🔔 通知已发送`; } catch(e) { return `❌ 通知失败: ${e.message}`; } } },
                { regex: /<qr-code(?:\s+size="(\d+)")?>([\s\S]*?)<\/qr-code>/g, name: 'qr-code', handler: async (m) => { let size = m[1]?parseInt(m[1]):120; let qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(m[2].trim())}`; return `<img src="${qrUrl}" class="qr-img" style="max-width:${size}px">`; } },

        async function runAgent(initialMsg) { 
            if (agentActive) return; 
            agentActive=true; 
            document.getElementById('status').innerHTML='<i class="fas fa-circle"></i> 运行中'; 
            addUserMsg(initialMsg); 
            if (conversationHistory.length === 0 || conversationHistory[0].role !== 'system') {
                const systemPrompt = currentMode === 'coding' ? SYSTEM_CODING : SYSTEM_AGENT;
                conversationHistory.unshift({role:'system', content:systemPrompt});
            }
            conversationHistory.push({role:'user', content:initialMsg});
            let step=0, maxSteps=currentMode === 'coding' ? 25 : 10;
            let lastOutputHash = "", consecutiveSame = 0;
            while(agentActive && step<maxSteps){ 
                step++; 
                document.getElementById('status').innerHTML=`<i class="fas fa-circle"></i> 思考中 (${step})`; 
                let agentDiv=addAgentMsgWithStream(); 
                let full=''; 
                const startTime = Date.now();
                try{ 
                    full=await streamDeepSeek(conversationHistory, (chunk)=>{ agentDiv.innerHTML+=chunk; agentDiv.scrollIntoView({behavior:'smooth',block:'nearest'}); }); 
                }catch(err){ addFeedbackMsg(`❌ API错误: ${err.message}`); break; } 
                const tokenEst = estimateTokens(full);
                totalTokensUsed += tokenEst;
                updateTokenDisplay();
                if (currentMode === 'coding') {
                    const hash = full.trim().substring(0,200);
                    if (hash === lastOutputHash && hash.length>20) { consecutiveSame++; if (consecutiveSame>=2) { addConsoleLog(`⚠️ 检测到重复输出，终止`, 'warn'); addFeedbackMsg(`⚠️ 重复输出，任务终止`); break; } }
                    else { consecutiveSame=0; lastOutputHash=hash; }
                }
                const {displayHtml,feedbacks,hasTaskDown,hasWaiting} = await parseAndExecuteTags(full); 
                agentDiv.innerHTML = displayHtml || full;
                conversationHistory.push({role:'assistant',content:full});
                if(feedbacks.length) conversationHistory.push({role:'system',content:'反馈:\n'+feedbacks.join('\n')});
                const duration = Date.now() - startTime;
                addConsoleLog(`🤖 本次消耗 ≈ ${tokenEst} tok | 累计 ${totalTokensUsed} tok (耗时 ${duration}ms)`, 'info');
                if(hasTaskDown){ addFeedbackMsg('🏁 任务完成'); break; }
                if(hasWaiting){ 
                    document.getElementById('status').innerHTML='<i class="fas fa-pause-circle"></i> 等待回复'; 
                    await new Promise(r=>{ waitingResolver=r; }); 
                    if(window._pendingReply){ 
                        conversationHistory.push({role:'user',content:window._pendingReply}); 
                        addUserMsg(window._pendingReply); 
                        window._pendingReply=null; 
                    } 
                    document.getElementById('status').innerHTML='<i class="fas fa-circle"></i> 继续执行'; 
                }
                if (currentMode !== 'coding' && !full.match(/<[a-z-]+/)) break;
            } 
            agentActive=false; 
            document.getElementById('status').innerHTML='<i class="fas fa-circle"></i> 空闲'; 
        }

        async function exportToPdf() { 
            const msgs=document.getElementById('messages'); 
            if(!msgs.children.length){addFeedbackMsg('无对话');return;} 
            addFeedbackMsg('生成PDF...'); 
            const clone=document.createElement('div'); 
            clone.style.position='absolute';clone.style.left='-9999px';clone.style.top='0';clone.style.width='800px';clone.style.background='white';clone.style.padding='30px'; 
            const header=document.createElement('div'); 
            header.innerHTML=`<h1>MuYanCoding 对话</h1><p>${new Date().toLocaleString()}</p><p>模式: ${currentMode === 'coding' ? 'CodingAgent' : 'Agent'} | 总计Token: ${totalTokensUsed}</p>`; 
            clone.appendChild(header); 
            const msgsClone=msgs.cloneNode(true); 
            for(let img of msgsClone.querySelectorAll('img')) try{ const c=await html2canvas(img); img.src=c.toDataURL(); }catch(e){} 
            clone.appendChild(msgsClone); 
            document.body.appendChild(clone); 
            try{ 
                const canvas=await html2canvas(clone,{scale:2}); 
                const imgData=canvas.toDataURL(); 
                const {jsPDF}=window.jspdf; 
                const pdf=new jsPDF(); 
                const imgWidth=190; 
                const imgHeight=(canvas.height*imgWidth)/canvas.width; 
                pdf.addImage(imgData,'PNG',10,0,imgWidth,imgHeight); 
                pdf.save(`muyan_${Date.now()}.pdf`); 
                addFeedbackMsg('PDF已下载'); 
            }catch(e){addFeedbackMsg('导出失败');}finally{document.body.removeChild(clone);} 
        }

        setInterval(()=>{ 
            if(document.getElementById('status').innerHTML.includes('等待回复') && !document.getElementById('waitBox')){ 
                const div=document.createElement('div'); div.id='waitBox'; div.innerHTML=`<input id="waitInput" placeholder="回复..." style="flex:1;background:transparent;border:none;color:white;"><button id="waitSend" class="primary"><i class="fas fa-paper-plane"></i> 发送</button>`; 
                document.getElementById('messages').appendChild(div); 
                document.getElementById('waitSend').onclick=()=>{ const val=document.getElementById('waitInput').value.trim(); if(val && waitingResolver){ window._pendingReply=val; waitingResolver(); div.remove(); } }; 
            } else if(!document.getElementById('status').innerHTML.includes('等待回复') && document.getElementById('waitBox')) document.getElementById('waitBox')?.remove(); 
        },200);
    })();
</script>
